name: Release Camo

# Собирает, подписывает (Developer ID) и нотаризует launcher/dist/Camo-macOS.zip
# по тегу camo-v* или вручную. Результат кладётся ТОЛЬКО в workflow-артефакт —
# этот workflow сознательно ничего никуда не публикует. Куда раздавать zip
# (внутренний файл-хостинг, приватный репо-релиз и т.п.) — решение владельца
# репозитория, не автоматизации. Скачать артефакт может только тот, у кого
# есть доступ к запускам Actions в этом репозитории.
#
# Обязательные секреты (Settings → Secrets and variables → Actions):
#   CAMO_CERT_P12_BASE64   — Developer ID Application .p12, закодированный в base64
#                            (security export -k login.keychain -t identities \
#                             -f pkcs12 -o cert.p12; base64 -i cert.p12 | pbcopy)
#   CAMO_CERT_PASSWORD     — пароль, которым зашифрован этот .p12
#   CAMO_DEVELOPER_ID      — точная строка identity, например
#                            "Developer ID Application: Компания (TEAMID)"
#   CAMO_NOTARY_APPLE_ID   — Apple ID для нотаризации
#   CAMO_NOTARY_TEAM_ID    — Team ID
#   CAMO_NOTARY_PASSWORD   — app-specific password для этого Apple ID
# Опциональная переменная (Settings → Secrets and variables → Actions → Variables):
#   CAMO_APPCAST_URL       — адрес appcast.json для автообновлений в приложении

on:
  push:
    tags:
      - "camo-v*"
  workflow_dispatch: {}

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import signing certificate into ephemeral keychain
        env:
          CAMO_CERT_P12_BASE64: ${{ secrets.CAMO_CERT_P12_BASE64 }}
          CAMO_CERT_PASSWORD: ${{ secrets.CAMO_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/camo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CAMO_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CAMO_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          EXISTING=$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "CAMO_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CAMO_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        env:
          CAMO_NOTARY_APPLE_ID: ${{ secrets.CAMO_NOTARY_APPLE_ID }}
          CAMO_NOTARY_TEAM_ID: ${{ secrets.CAMO_NOTARY_TEAM_ID }}
          CAMO_NOTARY_PASSWORD: ${{ secrets.CAMO_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials CAMO_NOTARY \
            --apple-id "$CAMO_NOTARY_APPLE_ID" \
            --team-id "$CAMO_NOTARY_TEAM_ID" \
            --password "$CAMO_NOTARY_PASSWORD" \
            --keychain "$CAMO_KEYCHAIN"

      - name: Package signed, notarized Camo.app
        working-directory: ios-concepts
        env:
          CAMO_DEVELOPER_ID: ${{ secrets.CAMO_DEVELOPER_ID }}
          CAMO_NOTARY_PROFILE: CAMO_NOTARY
          CAMO_APPCAST_URL: ${{ vars.CAMO_APPCAST_URL }}
        run: npm run launcher:package

      - name: Remove ephemeral keychain
        if: always()
        run: security delete-keychain "$CAMO_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Camo-macOS
          path: ios-concepts/launcher/dist/Camo-macOS.zip
          retention-days: 90
          if-no-files-found: error
