<div class="screen r-page" id="scr-voice">
  <div class="sheet">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body flush">
      <div class="r-top"><div class="r-top-title">Голосовое</div><div class="r-top-acts"><div class="r-icon tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></div></div></div>
      <div class="r-card pad">
        <div class="r-rec">
          <span class="rec-dot" aria-hidden="true"></span>
          <span class="r-rec-t">Идёт запись</span>
          <span class="r-rec-time">0:14</span>
        </div>
        <div class="r-wave r-wave-big"></div>
        <div class="r-times"><span>0:14</span><span>до 5:00</span></div>
      </div>
      <div class="r-card">
        <div class="r-row tap" data-toast="Прослушать запись" aria-label="Прослушать перед отправкой">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-play"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Прослушать</div><div class="r-row-s">перед отправкой, запись остаётся на устройстве</div></div>
        </div>
        <div class="r-row tap" data-toast="Сохранено в архив" aria-label="Сохранить в архив">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-audio-lines"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Сохранить в архив</div><div class="r-row-s">попадёт в «Записи»</div></div>
        </div>
      </div>
      <div class="state" data-show-denied="mic" hidden>
        <div class="state-ico"><svg class="ico-svg"><use href="#i-mic-off"/></svg></div>
        <div class="t-headline">Микрофон недоступен</div>
        <div class="t-body">Разрешение выдаётся в настройках телефона. Пока остаётся текст и вложение.</div>
        <div class="state-actions"><div class="btn-filled tap" data-go="conversation" aria-label="Вернуться к переписке">Написать текстом</div></div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-filled tap" data-primary data-go="conversation" aria-label="Отправить голосовое">Отправить</button>
    </div>
  </div>
</div>
