<div class="screen s-page" id="scr-settings">
  <div class="navbar"><div class="nav-leading"><button class="btn-plain tap" data-back aria-label="Назад"><svg class="ios-back" viewBox="0 0 12 21" fill="none"><path d="M10.25 1.75L1.75 10.5l8.5 8.75" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="title">Настройки</div></div>
  <div class="body-scroll s-scroll">
    <h2 class="s-group-title">Приложение</h2>
    <div class="s-settings-list">
      <button data-go="alerts"><svg class="ico-svg"><use href="#i-bell"/></svg><span><b>Оповещения</b><small>Лекарства и передачи</small></span><svg class="ico-svg"><use href="#i-chevron-right"/></svg></button>
      <button data-go="background"><svg class="ico-svg"><use href="#i-clock"/></svg><span><b>Фоновая работа</b><small>Слепок смен и фото</small></span><svg class="ico-svg"><use href="#i-chevron-right"/></svg></button>
      <button data-go="privacy"><svg class="ico-svg"><use href="#i-lock"/></svg><span><b>Приватность</b><small>Контакты и приглашения</small></span><svg class="ico-svg"><use href="#i-chevron-right"/></svg></button>
    </div>
    <h2 class="s-group-title">Безопасность</h2>
    <button class="s-device-action is-toggle tap" data-activate="keychain|settings" aria-label="Хранить ключ на устройстве"><span><b>Ключ приюта на устройстве</b><small>Защищён системным хранилищем</small></span><i class="s-switch"></i></button>
    <div class="s-denied perm-hidden" data-show-denied="keychain">Вводите код приюта при каждом входе</div>
    <button class="btn-filled tap s-primary" data-primary data-toast="Настройки сохранены">Сохранить настройки</button>
    <div class="s-space"></div>
  </div><div class="home-ind" aria-hidden="true"></div>
</div>
