<div class="screen s-page" id="scr-today">
  <div class="s-safe">
    <header class="s-top">
      <div>
        <span>СЕВЕРНЫЙ ПРИЮТ</span>
        <h1>Сегодня</h1>
      </div>
      <button class="s-avatar tap" data-go="settings" aria-label="Настройки">
        МО
      </button>
    </header>
  </div>
  <div class="body-scroll s-scroll">
    <div class="ph s-photo" aria-label="Фотография животного"></div>
    <div class="s-identity">
      <span>Собачий корпус · 08:00–12:00</span>
      <h2>Сейчас важнее всего</h2>
    </div>
    <div class="s-stack">
      <div class="s-card">
        <span class="s-mark">01</span
        ><span
          ><b>Рада · лекарство в 09:30</b
          ><small
            >После еды, половина таблетки. Марина отметила аппетит ниже
            обычного.</small
          ></span
        ><svg class="ico-svg ios-disclosure">
          <use href="#i-chevron-right" />
        </svg>
      </div>
    </div>
    <div class="s-quick">
      <button data-go="shifts">Будущие смены</button
      ><button data-go="route">Маршрут ухода</button
      ><button data-go="handoff">Передача</button>
    </div>
    <button class="btn-filled tap s-primary" data-primary data-go="task">
      Открыть смену
    </button>
    <div class="s-identity">
      <span>ДАЛЬШЕ ДО 12:00</span>
      <h2>План корпуса</h2>
    </div>
    <div class="s-stack">
      <div class="s-card">
        <span class="s-mark">02</span
        ><span
          ><b>Тиша · прогулка в 10:10</b
          ><small>Двор 2 · поводок и вода подготовлены</small></span
        ><svg class="ico-svg ios-disclosure">
          <use href="#i-chevron-right" />
        </svg>
      </div>
    </div>
    <div class="s-space"></div>
  </div>
  <div class="tabbar light" aria-label="Основная навигация">
    <button
      class="tab is-on"
      aria-current="page"
      data-go="today"
      aria-label="Раздел Сегодня"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-calendar-days" /></svg></span
      ><span class="tab-label">Сегодня</span></button
    ><button class="tab" data-go="animals" aria-label="Раздел Животные">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-heart" /></svg></span
      ><span class="tab-label">Животные</span></button
    ><button class="tab" data-go="observations" aria-label="Раздел Наблюдения">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-images" /></svg></span
      ><span class="tab-label">Наблюдения</span></button
    ><button class="tab" data-go="people" aria-label="Раздел Люди">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-users" /></svg></span
      ><span class="tab-label">Люди</span>
    </button>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
