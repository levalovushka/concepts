<div class="screen rd-screen rd-clipscene" id="scr-clips">
  <div class="rd-clipmedia"></div>
  <div class="rd-clip-brand"><span class="rd-mark"></span>Радиус</div>
  <div class="rd-clips-top">
    <div></div>
    <div class="rd-clips-switch">
      <strong>Для вас</strong><span>Подписки</span>
    </div>
    <div class="rd-hit">
      <svg class="rd-icon"><use href="#i-search" /></svg>
    </div>
  </div>
  <div class="rd-clip-actions">
    <div class="rd-clip-action">
      <div class="rd-hit">
        <svg class="rd-icon"><use href="#i-heart" /></svg>
      </div>
      18,2K
    </div>
    <div class="rd-clip-action">
      <div class="rd-hit">
        <svg class="rd-icon"><use href="#i-message-circle" /></svg>
      </div>
      428
    </div>
    <div class="rd-clip-action">
      <div class="rd-hit">
        <svg class="rd-icon"><use href="#i-share" /></svg>
      </div>
      <span class="rd-share-label">Поделиться</span>
    </div>
    <div class="rd-clip-action">
      <div class="rd-hit">
        <svg class="rd-icon"><use href="#i-bookmark" /></svg>
      </div>
    </div>
    <div class="rd-clip-action">
      <div class="rd-hit">
        <svg class="rd-icon"><use href="#i-ellipsis" /></svg>
      </div>
    </div>
  </div>
  <div class="rd-clip-copy">
    <div class="rd-clip-author" data-go="channel" aria-label="Край">
      <div class="rd-avatar">КР</div>
      <strong>Край</strong><span class="rd-clip-follow">Подписаться</span>
    </div>
    <h2>Ветер здесь меняет направление каждые пять минут</h2>
    <div class="rd-clip-sound">
      <svg class="rd-icon sm"><use href="#i-volume-2" /></svg
      ><span>Оригинальный звук</span>
    </div>
  </div>
  <div class="tabbar rd-tabs dark" aria-label="Основная навигация">
    <div class="tab" data-go="home" aria-label="Раздел Главная">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-house" /></svg></span
      ><span class="tab-label">Главная</span>
    </div>
    <div class="tab is-on" data-go="clips" aria-label="Раздел Клипы">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-video" /></svg></span
      ><span class="tab-label">Клипы</span>
    </div>
    <div class="tab" data-go="create" aria-label="Раздел Создать">
      <span class="ico rd-create-ico"
        ><svg class="rd-icon"><use href="#i-plus" /></svg></span
      ><span class="tab-label">Создать</span>
    </div>
    <div class="tab" data-go="subscriptions" aria-label="Раздел Подписки">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-users" /></svg></span
      ><span class="tab-label">Подписки</span>
    </div>
    <div class="tab" data-go="profile" aria-label="Раздел Профиль">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
