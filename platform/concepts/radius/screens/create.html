<div class="screen rd-screen rd-create-sheet-screen" id="scr-create">
  <div class="rd-create-backdrop"></div>
  <div class="rd-create-sheet">
    <div class="rd-create-sheet-group">
      <div class="rd-create-sheet-row" data-ask="photo|upload|create">
        <svg class="rd-icon"><use href="#i-images" /></svg>
        <div>
          <strong>Загрузить видео</strong>
        </div>
      </div>
      <div class="rd-create-sheet-row" data-ask="camera+mic|camera|create">
        <svg class="rd-icon"><use href="#i-video" /></svg>
        <div>
          <strong>Создать клип</strong>
        </div>
      </div>
      <div class="rd-create-sheet-row" data-ask="camera+mic|camera|create">
        <span class="rd-live-broadcast" aria-hidden="true"></span>
        <div>
          <strong>Начать трансляцию</strong>
        </div>
      </div>
    </div>
    <div class="rd-create-cancel" data-go="create">Отмена</div>
    <div class="rd-denied-box perm-hidden" data-show-denied="camera,mic">
      Камера или микрофон недоступны. Можно загрузить готовое видео.
    </div>
    <div class="rd-denied-box perm-hidden" data-show-denied="photo">
      Медиатека недоступна. Можно снять новое видео.
    </div>
  </div>
  <div class="tabbar rd-tabs">
    <div class="tab" data-go="home">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-house" /></svg></span
      ><span class="tab-label">Главная</span>
    </div>
    <div class="tab" data-go="clips">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-video" /></svg></span
      ><span class="tab-label">Клипы</span>
    </div>
    <div class="tab is-on" data-go="create">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-plus" /></svg></span
      ><span class="tab-label">Создать</span>
    </div>
    <div class="tab" data-go="subscriptions">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-users" /></svg></span
      ><span class="tab-label">Подписки</span>
    </div>
    <div class="tab" data-go="profile">
      <span class="ico"
        ><svg class="rd-icon"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
