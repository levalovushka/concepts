<div class="screen rd-screen" id="scr-phone">
  <div class="rd-safe"></div>
  <div class="body-scroll rd-auth rd-auth-vk">
    <div class="rd-auth-top">
      <div class="rd-wordmark"><span class="rd-mark"></span>Радиус</div>
    </div>
    <div class="rd-auth-copy">
      <h1>Смотрите, что происходит рядом</h1>
      <p>Войдите, чтобы подписываться на авторов и сохранять любимые места.</p>
    </div>
    <label class="rd-field-label" for="rd-phone-input">Номер телефона</label>
    <div class="rd-phone-field">
      <span class="rd-cc">+7</span
      ><input
        id="rd-phone-input"
        type="tel"
        inputmode="tel"
        value="900 123-45-67"
        aria-label="Номер телефона"
      />
    </div>
    <div class="rd-auth-foot">
      <div class="rd-primary" data-go="code">Продолжить</div>
      <p class="rd-legal">
        Нажимая «Получить код», вы принимаете условия сервиса и политику
        конфиденциальности.
      </p>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
