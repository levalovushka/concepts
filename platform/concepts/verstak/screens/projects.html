<div class="screen vs-page cx-page" id="scr-projects">
  <div class="body-scroll cx-scroll vs-safe">
    <header class="cx-top">
      <div>
        <span>МАСТЕРСКАЯ НА ЛЕСНОЙ</span>
        <h1>Проекты</h1>
      </div>
    </header>
    <section class="cx-section">
      <header><h2>В работе</h2></header>
      <button class="cx-row tap" data-go="project">
        <svg class="ico-svg"><use href="#i-layout-grid" /></svg
        ><span
          ><b>Полка для винила</b
          ><small>5 этапов · следующий: передача</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="project">
        <svg class="ico-svg"><use href="#i-zap" /></svg
        ><span><b>Корпус лампы</b><small>Фрезеровка · готово 72%</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="cx-section">
      <header><h2>Черновики</h2></header>
      <div class="cx-project-card">
        <span>СЕГОДНЯ · 18:42</span><b>Тест посадки шипа</b>
        <p>Без медиа · сохранено на этом iPhone</p>
      </div>
    </section>
    <button
      class="cx-fab tap"
      data-primary
      data-go="create"
      aria-label="Новый этап"
    >
      <span>Новый этап</span><svg class="ico-svg"><use href="#i-plus" /></svg>
    </button>
  </div>
  <div class="tabbar light vs-tabs" aria-label="Основная навигация">
    <div class="tab tap" data-go="machines" aria-label="Раздел Станки">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-wrench" /></svg></span
      ><span class="tab-label">Станки</span>
    </div>
    <div class="tab tap" data-go="schedule" aria-label="Раздел Расписание">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-calendar" /></svg></span
      ><span class="tab-label">Расписание</span>
    </div>
    <div
      class="tab tap is-on"
      aria-current="page"
      data-go="projects"
      aria-label="Раздел Проекты"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-layout-grid" /></svg></span
      ><span class="tab-label">Проекты</span>
    </div>
    <div class="tab tap" data-go="profile" aria-label="Раздел Профиль">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
