<div class="screen p-page" id="scr-chats">

    <button class="tab" data-go="recipes"><span class="ico"><svg class="ico-svg"><use href="#i-bookmark" /></svg></span><span>Рецепты</span></button>
    <button class="tab" data-go="profile"><span class="ico"><svg class="ico-svg"><use href="#i-user" /></svg></span><span>Профиль</span></button>

  <div class="home-ind"></div>
