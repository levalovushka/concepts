<div class="screen p-page" id="scr-privacy">
  <header class="navbar">
    <div class="nav-leading">
      <button class="btn-plain tap" data-back aria-label="Назад">
        <svg class="ios-back" viewBox="0 0 12 21" fill="none">
          <path
            d="M10.25 1.75L1.75 10.5l8.5 8.75"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    <div class="title">Конфиденциальность</div>
  </header>
  <main class="body-scroll p-scroll">
    <section class="p-section">
      <h2>Данные и доступы</h2>
      <button class="p-row tap" data-go="picker">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-images" /></svg></span
        ><span
          ><b>Фото и видео</b
          ><small>Только выбранные вами материалы</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-go="place">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-map-pin" /></svg></span
        ><span><b>Геопозиция</b><small>Только при добавлении места</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-go="following">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-users" /></svg></span
        ><span
          ><b>Контакты</b
          ><small>Сопоставление выполняется на устройстве</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="p-section">
      <h2>Реклама</h2>
      <button class="p-row tap" data-ask="tracking|privacy|privacy">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-shield" /></svg></span
        ><span
          ><b>Персонализация</b
          ><small>Включается отдельным согласием</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <div class="p-note" data-show-denied="tracking">
      <svg class="ico-svg"><use href="#i-info" /></svg
      ><span
        >Реклама останется контекстной и не будет учитывать активность вне
        приложения</span
      >
    </div>
    <button
      class="p-wide-link tap"
      data-primary
      data-toast="Политика · podacha.app/privacy"
    >
      Открыть политику конфиденциальности
    </button>
  </main>
  <div class="home-ind"></div>
</div>
