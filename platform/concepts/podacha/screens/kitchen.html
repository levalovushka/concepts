<div class="screen p-page" id="scr-kitchen">
  <header class="navbar">
    <div class="nav-leading">
      <button class="btn-plain tap" data-back aria-label="Назад">
        <svg class="ios-back" viewBox="0 0 12 21" fill="none">
          <path
            d="M10.25 1.75L1.75 10.5l8.5 8.75"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    <div class="title">Кухонный экран</div>
  </header>
  <main class="body-scroll p-scroll">
    <div class="p-kitchen-card">
      <small>Ужин · шаг 3 из 6</small><b>12:00</b>
      <h1>Томите под крышкой</h1>
      <p>Следующий шаг появится автоматически</p>
    </div>
    <div class="p-note" data-show-denied="localnetwork">
      <svg class="ico-svg"><use href="#i-info" /></svg
      ><span
        >Продолжайте на этом телефоне — шаги и таймер работают без общего
        экрана</span
      >
    </div>
    <button
      class="btn-filled tap"
      data-primary
      data-ask="localnetwork|cast|kitchen"
    >
      Найти экран на кухне
    </button>
  </main>
  <div class="home-ind"></div>
</div>
