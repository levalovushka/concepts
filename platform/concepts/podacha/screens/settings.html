<div class="screen p-page" id="scr-settings">
  <header class="navbar">
    <div class="nav-leading">
      <button class="btn-plain tap" data-back aria-label="Назад">
        <svg class="ios-back" viewBox="0 0 12 21" fill="none">
          <path
            d="M10.25 1.75L1.75 10.5l8.5 8.75"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    <div class="title">Настройки</div>
  </header>
  <main class="body-scroll p-scroll">
    <button class="p-account-entry tap" data-go="account">
      <span class="p-account-avatar ph"></span>
      <span><b>Жанна Ким</b><small>+7 900 123-45-67</small></span>
      <svg class="ico-svg"><use href="#i-chevron-right" /></svg>
    </button>
    <section class="p-section">
      <h2>Приватность</h2>
      <button class="p-row tap" data-go="privacy">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-shield" /></svg></span
        ><span
          ><b>Конфиденциальность</b
          ><small>Данные, доступы и реклама</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="p-section">
      <h2>Готовка</h2>
      <button class="p-row tap" data-ask="push|settings|settings">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-bell" /></svg></span
        ><span><b>Напоминания</b><small>Готовки и ответы авторов</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-activate="fetch|settings">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-repeat-2" /></svg></span
        ><span
          ><b>Свежая лента к открытию</b
          ><small>Короткое фоновое обновление</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-activate="processing|settings">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-list-checks" /></svg></span
        ><span
          ><b>Подготовка рецептов</b
          ><small>Сохранять шаги до начала</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-activate="keychain|settings">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-key" /></svg></span
        ><span
          ><b>Защищённый вход</b><small>Сессия хранится в Keychain</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <div class="p-note" data-show-denied="push">
      <svg class="ico-svg"><use href="#i-info" /></svg
      ><span
        >Всё останется доступно внутри приложения без системных
        уведомлений</span
      >
    </div>
    <section class="p-section">
      <h2>Системные обновления</h2>
      <button class="p-row tap" data-activate="remotenotif|settings">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-bell" /></svg></span
        ><span
          ><b>Ответы авторов</b
          ><small>Доставлять значимые изменения</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="p-section">
      <h2>На кухне</h2>
      <button class="p-row tap" data-go="audio">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-headphones" /></svg></span
        ><span><b>Рецепт вслух</b><small>Озвучивание шагов в фоне</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="p-row tap" data-go="kitchen">
        <span class="p-row-icon"
          ><svg class="ico-svg"><use href="#i-tv-minimal" /></svg></span
        ><span><b>Общий экран</b><small>Крупные шаги и таймер</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <button
      class="p-wide-link tap"
      data-primary
      data-activate="bgtask|settings"
    >
      Проверить фоновые задачи
    </button>
  </main>
  <div class="home-ind"></div>
</div>
