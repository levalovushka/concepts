<div class="screen p-page" id="scr-cookings">
  <main class="body-scroll p-scroll">
    <header class="p-top">
      <strong>Готовим вместе</strong>
      <div>
        <button class="p-icon tap" data-go="notif" aria-label="Уведомления">
          <svg class="ico-svg"><use href="#i-bell" /></svg>
        </button>
      </div>
    </header>
    <section class="p-day">
      <small>Сегодня · 16 сентября</small>
      <h1>Три кухни открыты</h1>
      <p>Совместная готовка — не чат, а общий темп по фиксированным шагам</p>
    </section>
    <section class="p-section">
      <h2>Сегодня</h2>
      <button class="p-event tap" data-go="cookalong">
        <time>19:00</time
        ><span
          ><b>Ужин из одной сковороды</b
          ><small>Амина ведёт · 8 из 12 мест</small
          ><em>6 шагов · 45 минут</em></span
        ></button
      ><button class="p-event tap" data-go="cookalong">
        <time>20:30</time
        ><span
          ><b>Хлеб без замеса</b><small>Тимур ведёт · 17 участников</small
          ><em>4 шага · ночь на расстойку</em></span
        >
      </button>
    </section>
    <button class="btn-filled p-cta tap" data-primary data-go="cookalong">
      Создать готовку
    </button>
  </main>
  <nav class="tabbar p-tabs" aria-label="Основная навигация">
    <button class="tab tap" data-go="feed" aria-label="Лента">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-house" /></svg></span
      ><span>Лента</span></button
    ><button
      class="tab tap is-on"
      data-go="cookings"
      aria-label="Готовим"
      aria-current="page"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-calendar" /></svg></span
      ><span>Готовим</span></button
    ><button class="tab tap" data-go="recipes" aria-label="Рецепты">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-bookmark" /></svg></span
      ><span>Рецепты</span></button
    ><button class="tab tap" data-go="profile" aria-label="Профиль">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg></span
      ><span>Профиль</span>
    </button>
  </nav>
  <div class="home-ind"></div>
</div>
