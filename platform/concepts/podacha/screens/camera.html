<div class="screen p-page p-dark" id="scr-camera">
  <header class="navbar">
    <div class="nav-leading">
      <button class="btn-plain tap" data-back aria-label="Назад">
        <svg class="ios-back" viewBox="0 0 12 21" fill="none">
          <path
            d="M10.25 1.75L1.75 10.5l8.5 8.75"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    <div class="title">Снять блюдо</div>
  </header>
  <main class="body-scroll p-scroll">
    <div class="p-camera">
      <div class="p-camera-grid"></div>
      <span>Естественный свет · без фильтра</span
      ><b>Покажите реальный результат</b>
    </div>
    <div class="p-note" data-show-denied="camera,mic">
      <svg class="ico-svg"><use href="#i-info" /></svg
      ><span>Можно выбрать готовый кадр и добавить текстовое пояснение</span>
    </div>
    <button
      class="p-shutter tap"
      data-primary
      data-ask="camera+mic|post|camera"
      aria-label="Снять"
    >
      <i></i>
    </button>
  </main>
  <div class="home-ind"></div>
</div>
