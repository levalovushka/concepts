<div class="screen stol-screen" id="scr-profile">
  <div class="st-safe"></div>
  <header class="st-top is-root">
    <h1>Профиль</h1>
    <div class="st-top-actions">
      <button
        class="st-icon-btn"
        data-go="settings"
        data-primary
        aria-label="Открыть настройки"
      >
        <svg class="st-icon"><use href="#i-settings" /></svg>
      </button>
    </div>
  </header>
  <div class="body-scroll st-page">
    <section class="st-profile-head">
      <div class="st-profile-main">
        <span class="st-profile-avatar"><span class="ph"></span></span>
        <div class="st-profile-copy">
          <h1>Саша Руденко</h1>
          <p>
            Спокойный темп · объясняю правила<br />Алматы · в «Столе» с апреля
          </p>
        </div>
      </div>
      <div class="st-stats">
        <button class="st-stat" data-toast="38 подписчиков">
          <strong>38</strong><span>подписчиков</span></button
        ><button class="st-stat" data-toast="24 партии">
          <strong>24</strong><span>партии</span></button
        ><button class="st-stat" data-toast="17 игр в коллекции">
          <strong>17</strong><span>игр</span>
        </button>
      </div>
      <div class="st-profile-actions">
        <button class="st-primary" data-toast="Профиль готов к редактированию">
          Редактировать</button
        ><button
          class="st-secondary"
          data-toast="Ссылка на профиль скопирована"
        >
          Поделиться
        </button>
      </div>
      <div class="st-tag-row">
        <span class="st-tag">Евро</span><span class="st-tag">Кооперативы</span
        ><span class="st-tag">До 90 минут</span>
      </div>
    </section>
    <div class="st-section-title">Ваши партии</div>
    <div class="st-grid">
      <button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Лесные союзы"
      >
        <span class="ph"></span><span class="st-grid-score">71</span></button
      ><button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Городские линии"
      >
        <span class="ph"></span><span class="st-grid-score">54</span></button
      ><button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Архив острова"
      >
        <span class="ph"></span><span class="st-grid-score">89</span></button
      ><button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Маршруты Севера"
      >
        <span class="ph"></span><span class="st-grid-score">62</span></button
      ><button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Тихая гавань"
      >
        <span class="ph"></span><span class="st-grid-score">33</span></button
      ><button
        class="st-grid-item"
        data-go="post"
        aria-label="Открыть партию Карта ветров"
      >
        <span class="ph"></span><span class="st-grid-score">48</span>
      </button>
    </div>
  </div>
  <nav class="tabbar st-tabbar" aria-label="Основная навигация">
    <button class="tab" data-go="feed" aria-label="Лента">
      <span class="ico"
        ><svg class="st-icon"><use href="#i-house" /></svg></span
      ><span class="tab-label">Лента</span></button
    ><button class="tab" data-go="games" aria-label="Игры">
      <span class="ico"
        ><svg class="st-icon"><use href="#i-layout-grid" /></svg></span
      ><span class="tab-label">Игры</span></button
    ><button class="tab" data-go="tables" aria-label="Столы">
      <span class="ico"
        ><svg class="st-icon"><use href="#i-users" /></svg></span
      ><span class="tab-label">Столы</span></button
    ><button class="tab is-on" data-go="profile" aria-label="Профиль">
      <span class="ico"
        ><svg class="st-icon"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </button>
  </nav>
  <div class="home-ind" aria-hidden="true"></div>
</div>
