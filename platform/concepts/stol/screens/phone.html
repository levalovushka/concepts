<div class="screen stol-screen stol-auth-shell" id="scr-phone">
  <div class="unified-auth-body">
    <div class="auth-mark" aria-hidden="true">
      <svg class="auth-brand-glyph"><use href="#i-layout-grid" /></svg>
    </div>
    <h1>Ваше место за столом</h1>
    <p class="unified-auth-lede">
      Войдите, чтобы знакомые игроки узнали вас, а занятое место осталось за
      вами
    </p>
    <label class="unified-auth-field"
      ><span>Номер телефона</span
      ><input
        type="tel"
        value="+7 900 123-45-67"
        autocomplete="tel"
        aria-label="Номер телефона"
    /></label>
    <div class="unified-auth-actions">
      <button class="btn-filled tap" data-primary data-go="password">
        Далее</button
      ><button class="unified-auth-link tap" data-go="register">
        Создать аккаунт</button
      ><button class="unified-auth-link tap" data-auth-target data-go="feed">
        Посмотреть столы без аккаунта
      </button>
      <p class="auth-legal">
        Продолжая, вы принимаете
        <button
          class="auth-legal-link"
          data-toast="Соглашение · stol.place/terms"
        >
          пользовательское соглашение
        </button>
        и
        <button
          class="auth-legal-link"
          data-toast="Политика · stol.place/privacy"
        >
          политику конфиденциальности</button
        >.
      </p>
    </div>
    <button
      class="unified-auth-help tap"
      data-toast="Справка · stol.place/help · support@stol.place"
    >
      Помощь и поддержка
    </button>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
