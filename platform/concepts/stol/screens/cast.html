<div class="screen stol-screen" id="scr-cast">
  <div class="st-safe"></div>
  <header class="st-top">
    <button class="st-icon-btn" data-back aria-label="Назад">
      <svg class="ios-back" viewBox="0 0 12 21" fill="none">
        <path
          d="M10.25 1.75L1.75 10.5l8.5 8.75"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1>Общий экран</h1>
    <button
      class="st-icon-btn"
      data-activate="wifiinfo|cast"
      aria-label="Проверить сеть"
    >
      <svg class="st-icon"><use href="#i-repeat-2" /></svg>
    </button>
  </header>
  <div class="body-scroll">
    <div class="st-section-title">Сеть: Polka Guest</div>
    <section class="st-round-card">
      <button
        class="st-device-row st-block"
        data-primary
        data-ask="localnetwork|cast|cast"
      >
        <span class="st-device-mark"
          ><svg class="st-icon"><use href="#i-tv-minimal" /></svg></span
        ><span class="st-device-copy"
          ><strong>Экран у большого стола</strong
          ><span>Google Cast · готов к показу</span></span
        ><svg class="st-icon st-chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button class="st-device-row st-block" data-ask="localnetwork|cast|cast">
        <span class="st-device-mark"
          ><svg class="st-icon"><use href="#i-tv-minimal" /></svg></span
        ><span class="st-device-copy"
          ><strong>Проектор клуба</strong
          ><span>Последний раз: вчера</span></span
        ><svg class="st-icon st-chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <div class="st-fallback perm-hidden" data-show-denied="localnetwork">
      Оставьте табло на телефоне: счёт и ручной ввод продолжат работать
    </div>
    <div class="st-fallback perm-hidden" data-show-denied="wifiinfo">
      Убедитесь вручную, что телефон и экран подключены к одной сети
    </div>
    <div class="st-section-title">Что увидят игроки</div>
    <section class="st-round-card">
      <div class="st-list-row">
        <span class="st-session-date">71</span
        ><span class="st-list-copy"
          ><strong>Маша лидирует</strong
          ><span>Илья 64 · Саша 58 · раунд 4</span></span
        >
      </div>
    </section>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
