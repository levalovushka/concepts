<div class="screen stol-screen" id="scr-table">
  <div class="st-safe"></div>
  <header class="st-top">
    <button class="st-icon-btn" data-back aria-label="Назад">
      <svg class="ios-back" viewBox="0 0 12 21" fill="none">
        <path
          d="M10.25 1.75L1.75 10.5l8.5 8.75"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1>Стол</h1>
    <button
      class="st-icon-btn"
      data-toast="Ссылка на стол скопирована"
      aria-label="Поделиться столом"
    >
      <svg class="st-icon"><use href="#i-share" /></svg>
    </button>
  </header>
  <div class="body-scroll">
    <section class="st-detail-hero">
      <h1>Лесные союзы</h1>
      <p>Сегодня, 19:30 · клуб «Полка»<br />75 минут · спокойный темп</p>
      <div class="st-table-board" aria-label="Схема мест за столом">
        <span class="st-board-center"
          ><span><strong>Стол Маши</strong><span>3 из 4 мест</span></span></span
        ><i class="st-pawn p1"></i><i class="st-pawn p2"></i
        ><i class="st-pawn p3"></i><i class="st-pawn open"></i>
      </div>
      <div class="st-detail-actions">
        <button
          class="st-primary"
          data-primary
          data-toast="Место за столом занято"
        >
          Занять место</button
        ><button class="st-secondary" data-go="score">Открыть счёт</button>
      </div>
    </section>
    <div class="st-section-title">Участники</div>
    <section class="st-round-card">
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Маша Орлова</span><small>создала стол</small>
      </div>
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Илья Левин</span><small>объяснит правила</small>
      </div>
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Саша Руденко</span><small>играл 3 раза</small>
      </div>
    </section>
    <div class="st-section-title">Не пропустить</div>
    <section class="st-round-card">
      <button class="st-setting st-block" data-ask="calendar|table|table">
        <span class="st-setting-mark"
          ><svg class="st-icon"><use href="#i-calendar" /></svg></span
        ><span class="st-setting-copy"
          ><strong>Добавить в календарь</strong
          ><span>Сегодня, 19:30–20:45</span></span
        ><svg class="st-icon st-chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button class="st-setting st-block" data-ask="push|table|table">
        <span class="st-setting-mark"
          ><svg class="st-icon"><use href="#i-bell" /></svg></span
        ><span class="st-setting-copy"
          ><strong>Следить за столом</strong
          ><span>Изменения времени и состава</span></span
        ><span class="st-switch"></span>
      </button>
    </section>
    <div class="st-fallback perm-hidden" data-show-denied="calendar">
      Скопируйте: сегодня, 19:30 · клуб «Полка», Абая 44
    </div>
    <div class="st-fallback perm-hidden" data-show-denied="push">
      Изменения останутся в карточке стола и ленте
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
