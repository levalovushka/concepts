<div class="screen stol-screen" id="scr-score">
  <div class="st-safe"></div>
  <header class="st-top">
    <button class="st-icon-btn" data-back aria-label="Назад">
      <svg class="ios-back" viewBox="0 0 12 21" fill="none">
        <path
          d="M10.25 1.75L1.75 10.5l8.5 8.75"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1>Счёт · раунд 4</h1>
    <button
      class="st-icon-btn"
      data-go="cast"
      aria-label="Показать на общем экране"
    >
      <svg class="st-icon"><use href="#i-tv-minimal" /></svg>
    </button>
  </header>
  <div class="body-scroll">
    <main class="st-score-list">
      <div class="st-score-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span class="st-score-name"
          ><strong>Маша</strong><span>ход завершён</span></span
        ><button
          class="st-score-step"
          data-toast="Минус одно очко"
          aria-label="Уменьшить счёт Маши"
        >
          −</button
        ><span class="st-score-value">71</span
        ><button
          class="st-score-step"
          data-toast="Плюс одно очко"
          aria-label="Увеличить счёт Маши"
        >
          +
        </button>
      </div>
      <div class="st-score-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span class="st-score-name"
          ><strong>Илья</strong><span>активный игрок</span></span
        ><button
          class="st-score-step"
          data-toast="Минус одно очко"
          aria-label="Уменьшить счёт Ильи"
        >
          −</button
        ><span class="st-score-value">64</span
        ><button
          class="st-score-step"
          data-toast="Плюс одно очко"
          aria-label="Увеличить счёт Ильи"
        >
          +
        </button>
      </div>
      <div class="st-score-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span class="st-score-name"
          ><strong>Саша</strong><span>ожидает ход</span></span
        ><button
          class="st-score-step"
          data-toast="Минус одно очко"
          aria-label="Уменьшить счёт Саши"
        >
          −</button
        ><span class="st-score-value">58</span
        ><button
          class="st-score-step"
          data-toast="Плюс одно очко"
          aria-label="Увеличить счёт Саши"
        >
          +
        </button>
      </div>
    </main>
    <div class="st-score-actions">
      <button
        class="st-primary st-listen"
        data-primary
        data-ask="speech+mic|score|score"
      >
        <svg class="st-icon"><use href="#i-mic" /></svg
        ><span>Назвать счёт</span></button
      ><button class="st-secondary" data-go="cast">Показать на экране</button>
      <div class="st-fallback perm-hidden" data-show-denied="speech,mic">
        Голос недоступен. Используйте кнопки плюс и минус рядом с игроком
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
