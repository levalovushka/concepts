<div class="screen stol-screen st-messenger" id="scr-direct-sasha">
  <div class="st-safe"></div>
  <header class="st-top st-chat-top"><button class="st-icon-btn" data-back aria-label="Назад"><svg class="st-icon"><use href="#i-chevron-left" /></svg></button><button class="st-chat-person" data-go="profile"><span class="st-chat-avatar"><span class="ph"></span></span><span><b>Саша Руденко</b><small>был недавно</small></span></button><button class="st-icon-btn" data-ask="mic+voip|direct-sasha|direct-sasha" aria-label="Позвонить Саше"><svg class="st-icon"><use href="#i-phone" /></svg></button></header>
  <main class="body-scroll st-messages">
    <p class="st-chat-day">Понедельник</p>
    <div class="st-bubble incoming"><b>Саша</b><span>Сыграем ещё раз на неделе?</span><time>18:42</time></div>
    <div class="st-bubble outgoing"><span>Да, давай в четверг после работы</span><time>18:45 · прочитано</time></div>
    <div class="st-bubble incoming"><b>Саша</b><span>Отлично, я принесу «Архив острова»</span><time>18:47</time></div>
    <p class="st-chat-state perm-hidden" data-show-granted="voip">Звонок начат</p><p class="st-chat-state perm-hidden" data-show-denied="photos">Можно отправить сообщение без фото</p><p class="st-chat-state perm-hidden" data-show-denied="mic">Голосовое недоступно — напишите сообщение</p>
  </main>
  <div class="st-composer"><button data-ask="photos|direct-sasha|direct-sasha" aria-label="Добавить фото"><svg class="st-icon"><use href="#i-paperclip" /></svg></button><label><input aria-label="Сообщение" placeholder="Сообщение Саше" /></label><button data-ask="mic|direct-sasha|direct-sasha" aria-label="Записать голосовое"><svg class="st-icon"><use href="#i-mic" /></svg></button><button data-primary data-toast="Сообщение отправлено" aria-label="Отправить"><span class="ui-visually-hidden">Отправить сообщение</span><svg class="st-icon"><use href="#i-send" /></svg></button></div>
  <div class="home-ind"></div>
</div>
