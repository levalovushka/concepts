<div class="screen stol-screen" id="scr-audio">
  <div class="st-safe"></div>
  <header class="st-top">
    <button class="st-icon-btn" data-back aria-label="Назад">
      <svg class="ios-back" viewBox="0 0 12 21" fill="none">
        <path
          d="M10.25 1.75L1.75 10.5l8.5 8.75"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1>Памятка</h1>
    <button
      class="st-icon-btn"
      data-toast="Памятка загружена на устройство"
      aria-label="Скачать памятку"
    >
      <svg class="st-icon"><use href="#i-download" /></svg>
    </button>
  </header>
  <div class="body-scroll">
    <section class="st-player-card">
      <span class="st-player-mark"
        ><svg class="st-icon"><use href="#i-audio-lines" /></svg
      ></span>
      <h1>Лесные союзы</h1>
      <p>Подготовка поля · глава 2 из 5</p>
      <div class="st-progress"><span></span></div>
      <div class="st-time"><span>02:14</span><span>06:28</span></div>
    </section>
    <div class="st-player-controls">
      <button data-toast="Назад на 15 секунд" aria-label="Назад на 15 секунд">
        <svg class="st-icon"><use href="#i-rotate-ccw" /></svg></button
      ><button
        class="is-main"
        data-primary
        data-activate="audio|audio"
        aria-label="Слушать памятку"
      >
        <svg class="st-icon"><use href="#i-play" /></svg></button
      ><button
        data-toast="Вперёд на 15 секунд"
        aria-label="Вперёд на 15 секунд"
      >
        <svg class="st-icon"><use href="#i-rotate-cw" /></svg>
      </button>
    </div>
    <div class="st-fallback perm-hidden" data-show-denied="audio">
      Читайте главы ниже: фон отключён, но текстовая памятка доступна полностью
    </div>
    <div class="st-section-title">Главы</div>
    <section class="st-round-card">
      <div class="st-chapter"><b>01</b><span>Цель партии</span></div>
      <div class="st-chapter"><b>02</b><span>Подготовка поля</span></div>
      <div class="st-chapter"><b>03</b><span>Ход игрока</span></div>
      <div class="st-chapter"><b>04</b><span>Подсчёт союзов</span></div>
      <div class="st-chapter"><b>05</b><span>Финальный раунд</span></div>
    </section>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
