<div class="screen stol-screen" id="scr-post">
  <div class="st-safe"></div>
  <header class="st-top">
    <button class="st-icon-btn" data-back aria-label="Назад">
      <svg class="ios-back" viewBox="0 0 12 21" fill="none">
        <path
          d="M10.25 1.75L1.75 10.5l8.5 8.75"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1>Публикация</h1>
    <button
      class="st-icon-btn"
      data-toast="Скрыть · Пожаловаться · Скопировать ссылку"
      aria-label="Ещё о публикации"
    >
      <svg class="st-icon"><use href="#i-ellipsis" /></svg>
    </button>
  </header>
  <div class="body-scroll">
    <article class="st-card">
      <div class="st-post-head">
        <span class="st-avatar"><span class="ph"></span></span
        ><span class="st-post-who post-author"
          ><strong>Маша Орлова</strong
          ><span>сегодня, 12:14 · клуб «Полка»</span></span
        >
      </div>
      <div class="st-post-copy">
        Вечером раскладываем «Лесные союзы». Объяснение займёт минут десять,
        играем спокойно, без гонки за первым ходом
      </div>
      <div class="st-media">
        <span class="ph"></span
        ><span class="st-media-tag">Лесные союзы · 2–4</span>
      </div>
      <button
        class="st-session-card st-block"
        data-primary
        data-go="table"
        aria-label="Открыть связанный стол"
      >
        <span class="st-session-date">19:30</span
        ><span class="st-session-copy"
          ><b>Одно место свободно</b
          ><span>75 минут · объясним правила</span></span
        ><svg class="st-icon st-chevron"><use href="#i-chevron-right" /></svg>
      </button>
      <div class="st-actions">
        <button class="st-action is-on" data-toast="Реакция добавлена">
          <svg class="st-icon"><use href="#i-heart" /></svg
          ><span>18</span></button
        ><button class="st-action" data-toast="Поделиться публикацией">
          <svg class="st-icon"><use href="#i-share" /></svg
          ><span>4</span></button
        ><button class="st-action last" data-toast="Публикация сохранена">
          <svg class="st-icon"><use href="#i-bookmark" /></svg
          ><span>Сохранить</span>
        </button>
      </div>
    </article>
    <div class="st-section-title">За этим столом</div>
    <section class="st-round-card">
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Маша Орлова</span><small>создала стол</small>
      </div>
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Илья Левин</span><small>объяснит правила</small>
      </div>
      <div class="st-member-row">
        <span class="st-avatar"><span class="ph"></span></span
        ><span>Саша Руденко</span><small>место занято</small>
      </div>
    </section>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
