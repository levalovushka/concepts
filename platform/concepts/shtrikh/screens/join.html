<div class="screen s-page s-onboarding" id="scr-join">
  <div class="body-scroll s-onboarding-scroll">
    <header class="s-onboarding-head">
      <span class="s-onboarding-mark"><svg class="ico-svg"><use href="#i-file-text" /></svg></span>
      <button class="s-vkicon" data-go="home" aria-label="Пропустить"><svg class="ico-svg"><use href="#i-x" /></svg></button>
    </header>
    <section class="s-onboarding-intro">
      <span class="s-onboarding-step">Шаг 1 из 2</span>
      <h1>Город для зарисовок</h1>
      <p>Покажем работы, места и пленэры рядом с вами</p>
    </section>
    <button class="s-city-choice" data-ask="location|verify|manual">
      <span class="s-city-choice-icon"><svg class="ico-svg"><use href="#i-navigation" /></svg></span>
      <span><b>Определить город</b><small>Только один раз при настройке</small></span>
      <svg class="ico-svg s-city-choice-chevron"><use href="#i-chevron-right" /></svg>
    </button>
    <section class="s-onboarding-preview" aria-label="Что появится в ленте">
      <div class="s-onboarding-map"><i></i><i></i><i></i><span>Алматы</span></div>
      <div class="s-onboarding-facts">
        <span><b>32</b><small>автора рядом</small></span>
        <span><b>14</b><small>сохранённых мест</small></span>
        <span><b>4</b><small>пленэра на неделе</small></span>
      </div>
    </section>
    <div class="push"></div>
    <div class="s-onboarding-actions">
      <button class="s-btn" data-ask="location|verify|manual">Продолжить</button>
      <button class="s-onboarding-link" data-go="manual">Выбрать город вручную</button>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
