<div class="screen s-night" id="scr-shoot">
  <div class="s-shot">
    <div style="padding: calc(var(--safe-top) + 4px) 12px 6px; flex: none">
      <div class="s-shot-slot tap" data-back aria-label="Закрыть камеру">
        <svg class="ico-svg"><use href="#i-x" /></svg>
      </div>
    </div>
    <div class="s-shot-view">
      <div class="ph on-dark" style="width: 100%; height: 100%"></div>
      <div class="s-shot-hint">Рисунок целиком в кадре</div>
    </div>
    <div class="s-shot-bar">
      <div class="s-shot-slot" aria-hidden="true">
        <svg class="ico-svg"><use href="#i-images" /></svg>
      </div>
      <div
        class="s-shutter"
        data-toast="Работа добавлена в черновик|problem"
        aria-label="Снять кадр"
      ></div>
      <div class="s-shot-slot" aria-hidden="true">
        <svg class="ico-svg"><use href="#i-rotate-cw" /></svg>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
