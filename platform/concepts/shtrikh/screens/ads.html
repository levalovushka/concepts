<div class="screen s-page" id="scr-ads">
  <div class="body-scroll s-scroll s-safe s-col">
    <div class="s-top">
      <div class="s-back tap" data-back aria-label="Закрыть экран про рекламу">
        <svg class="ico-svg"><use href="#i-x" /></svg>
        <span class="s-back-n">Закрыть</span>
      </div>
      <div class="s-top-title sm">Реклама</div>
    </div>

    <div class="s-card pad">
      <div class="s-hero" style="padding: 8px 0 4px">
        <div class="auth-mark" style="margin: 0 auto 16px" aria-hidden="true">
          <svg class="ico-svg" style="width: 30px; height: 30px">
            <use href="#i-megaphone" />
          </svg>
        </div>
        <div class="s-hero-t">Штрих остаётся бесплатным</div>
        <div class="s-hero-d">
          Между публикациями бывает реклама материалов. Разрешение делает её
          релевантнее
        </div>
      </div>
    </div>

    <div class="s-sec">Что меняется</div>
    <div class="s-card">
      <div class="s-row top">
        <span class="s-bul" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-map-pin" /></svg
        ></span>
        <div class="s-row-main">
          <div class="s-row-title">С разрешением</div>
          <div class="s-row-sub wrap">материалы и мастерские по интересам</div>
        </div>
      </div>
      <div class="s-row top">
        <span class="s-bul" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-circle-x" /></svg
        ></span>
        <div class="s-row-main">
          <div class="s-row-title">Без разрешения</div>
          <div class="s-row-sub wrap">та же реклама, но случайная</div>
        </div>
      </div>
    </div>

    <div class="s-card perm-hidden" data-show-denied="tracking">
      <div class="s-note">
        <svg class="ico-svg"><use href="#i-circle-alert" /></svg>
        <span>Отслеживание запрещено — реклама случайная</span>
      </div>
    </div>

    <div class="push"></div>
    <div class="s-cta">
      <div class="s-btn" data-ask="tracking|menu|ads">Продолжить</div>
      <div class="s-btn quiet mt8" data-back>Не сейчас</div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
