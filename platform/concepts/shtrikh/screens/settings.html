<div class="screen s-page" id="scr-settings">
  <header class="s-pushbar">
    <button data-back>
      <svg class="ico-svg ios-back">
        <use href="#i-chevron-left" />
      </svg></button
    ><strong>Настройки</strong><span></span>
  </header>
  <div class="body-scroll s-scroll">
    <div class="s-list-section">
      <h2>Аккаунт</h2>
      <button data-go="account">
        <span class="s-list-icon blue"
          ><svg class="ico-svg"><use href="#i-user" /></svg></span
        ><span><b>Аккаунт</b><small>Телефон, пароль, удаление</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-go="passwords">
        <span class="s-list-icon violet"
          ><svg class="ico-svg"><use href="#i-lock" /></svg></span
        ><span
          ><b>Приватность</b><small>Черновики, контакты, реклама</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
    <div class="s-list-section">
      <h2>Приложение</h2>
      <button data-go="meters">
        <span class="s-list-icon red"
          ><svg class="ico-svg"><use href="#i-bell" /></svg></span
        ><span><b>Уведомления</b><small>Ответы, места и пленэры</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-activate="fetch|background">
        <span class="s-list-icon green"
          ><svg class="ico-svg"><use href="#i-repeat-2" /></svg></span
        ><span><b>Обновление в фоне</b><small>Сохранённые места</small></span
        ><span class="switch is-on"><i></i></span></button
      ><button data-activate="appgroups|widget">
        <span class="s-list-icon blue"
          ><svg class="ico-svg"><use href="#i-layout-grid" /></svg></span
        ><span><b>Виджет места дня</b><small>Главный экран iPhone</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
    <div class="s-list-section">
      <button data-toast="Поддержка · support@shtrikh.app">
        <span><b>Помощь и поддержка</b><small>Ответим на вопросы</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-toast="Условия · shtrikh.app/terms">
        <span><b>О приложении</b><small>Условия и политика</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-activate="remotenotif|background">
        <span class="s-list-icon blue"
          ><svg class="ico-svg"><use href="#i-bell" /></svg></span
        ><span><b>Тихие обновления</b><small>Новые работы мест</small></span
        ><span class="switch is-on"><i></i></span>
      </button>
    </div>
    <p class="s-list-foot perm-hidden" data-show-denied="remotenotif">
      Лента обновится при открытии
    </p>
  </div>
  <div class="home-ind"></div>
</div>
