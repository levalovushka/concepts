<div class="screen s-page s-onboarding" id="scr-verify">
  <div class="body-scroll s-onboarding-scroll">
    <header class="s-onboarding-head">
      <button class="s-vkicon" data-back aria-label="Назад"><svg class="ios-back" viewBox="0 0 12 21" fill="none"><path d="M10.25 1.75L1.75 10.5l8.5 8.75" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
      <span class="s-onboarding-step">Шаг 2 из 2</span>
      <span class="s-onboarding-head-space"></span>
    </header>
    <section class="s-onboarding-intro compact">
      <h1>Алматы</h1>
      <p>Начнём с мест, где уже рисуют знакомые авторы</p>
    </section>
    <section class="s-city-map" aria-label="Карта выбранного города">
      <span class="s-city-road one"></span><span class="s-city-road two"></span><span class="s-city-road three"></span>
      <i class="one">12</i><i class="two">8</i><i class="three">5</i>
      <div><svg class="ico-svg"><use href="#i-map-pin" /></svg><span><b>Ваш город</b><small>Алматы</small></span></div>
    </section>
    <section class="s-nearby-list">
      <h2>Начальные места</h2>
      <button><span class="s-place-swatch ochre"></span><span><b>Зелёный базар</b><small>42 работы · 19 авторов</small></span><svg class="ico-svg"><use href="#i-check" /></svg></button>
      <button><span class="s-place-swatch blue"></span><span><b>Старый центр</b><small>27 работ · 12 авторов</small></span><svg class="ico-svg"><use href="#i-check" /></svg></button>
      <button><span class="s-place-swatch green"></span><span><b>Терренкур</b><small>18 работ · 11 авторов</small></span><svg class="ico-svg"><use href="#i-check" /></svg></button>
    </section>
    <div class="push"></div>
    <div class="s-onboarding-actions">
      <button class="s-btn" data-activate="wifiinfo|home">Открыть «Штрих»</button>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
