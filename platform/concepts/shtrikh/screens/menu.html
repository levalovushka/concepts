<div class="screen s-page" id="scr-menu">
  <div class="body-scroll s-scroll">
    <header class="s-vkbar">
      <strong>Сервисы</strong>
      <div>
        <button
          class="s-vkicon"
          data-go="settings"
          aria-label="Открыть настройки"
        >
          <svg class="ico-svg"><use href="#i-settings" /></svg>
        </button>
      </div>
    </header>
    <section class="s-card s-menu-profile" data-go="profile">
      <span class="s-avatar"><span class="ph"></span></span>
      <div><b>Анна Разумова</b><small>Мой профиль · 36 работ</small></div>
      <svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
    </section>
    <div class="s-list-section">
      <button data-go="chronicle">
        <span class="s-list-icon blue"
          ><svg class="ico-svg"><use href="#i-images" /></svg></span
        ><span><b>Мои серии</b><small>7 серий мест</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-go="neighbors">
        <span class="s-list-icon violet"
          ><svg class="ico-svg"><use href="#i-users" /></svg></span
        ><span><b>Авторы</b><small>Знакомые и подписки</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-go="guest">
        <span class="s-list-icon green"
          ><svg class="ico-svg"><use href="#i-wifi" /></svg></span
        ><span><b>Экран выставки</b><small>Показать работы рядом</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
    <div class="s-list-section">
      <button data-go="settings">
        <span class="s-list-icon gray"
          ><svg class="ico-svg"><use href="#i-settings" /></svg></span
        ><span><b>Настройки</b><small>Уведомления и приватность</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
  </div>
  <nav class="tabbar s-dock">
    <div class="tab" data-go="home">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-house" /></svg></span
      ><span class="tab-label">Главная</span>
    </div>
    <div class="tab" data-go="yard">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-map-pin" /></svg></span
      ><span class="tab-label">Места</span>
    </div>
    <div class="tab" data-go="events">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-calendar" /></svg></span
      ><span class="tab-label">Пленэры</span>
    </div>
    <div class="tab" data-go="chats"><span class="ico"><svg class="ico-svg"><use href="#i-message-circle" /></svg></span><span class="tab-label">Чаты</span></div>
    <div class="tab is-on">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-menu" /></svg></span
      ><span class="tab-label">Сервисы</span>
    </div>
  </nav>
  <div class="home-ind"></div>
</div>
