<div class="screen s-page" id="scr-passwords">
  <div class="body-scroll s-scroll">
    <header class="s-pushbar">
      <button data-back>
        <svg class="ico-svg ios-back">
          <use href="#i-chevron-left" />
        </svg></button
      ><strong>Приватность</strong><span></span>
    </header>
    <div class="s-list-section">
      <h2>Материалы</h2>
      <button data-ask="faceid|lock|passwords">
        <span
          ><b>Замок черновиков</b
          ><small>Face ID или код устройства</small></span
        ><span class="switch is-on"><i></i></span></button
      ><button data-toast="Сохранённые работы видны только вам">
        <span><b>Кто видит сохранённое</b><small>Только я</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
    <div class="s-list-section">
      <h2>Данные</h2>
      <button data-ask="contacts|neighbors|passwords">
        <span
          ><b>Поиск среди контактов</b><small>Сверка на устройстве</small></span
        ><span class="switch"><i></i></span></button
      ><button data-go="ads">
        <span><b>Персонализация рекламы</b><small>Выключена</small></span
        ><svg class="ico-svg chevron">
          <use href="#i-chevron-right" />
        </svg></button
      ><button data-activate="autofill|fill">
        <span
          ><b>Вход в веб-портфолио</b
          ><small>Системное автозаполнение</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </div>
    <p class="s-list-foot">
      Контакты и черновики не выгружаются целиком. Геопозиция используется
      только при выборе места
    </p>
    <p class="s-list-foot perm-hidden" data-show-denied="faceid">
      Остаётся код-пароль устройства
    </p>
    <p class="s-list-foot perm-hidden" data-show-denied="contacts">
      Остаётся поиск по имени
    </p>
  </div>
  <div class="home-ind"></div>
</div>
