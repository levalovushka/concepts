<div class="screen s-night" id="scr-lock">
  <div class="s-lock">
    <div class="auth-mark" style="margin: 64px auto 0" aria-hidden="true">
      <svg class="ico-svg" style="width: 30px; height: 30px">
        <use href="#i-scan-face" />
      </svg>
    </div>

    <div class="s-hero" style="width: 100%">
      <div class="s-hero-t" style="color: #fff">Черновики защищены</div>
      <div class="s-hero-d" style="color: rgba(255, 255, 255, 0.68)">
        Неопубликованные работы доступны только вам
      </div>
    </div>

    <div class="push"></div>
    <div class="s-notif" style="padding: 20px 16px; text-align: center">
      <div class="s-notif-head" style="justify-content: center">
        <span class="s-icon" style="color: #fff" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-scan-face" /></svg
        ></span>
        <span class="s-notif-name">Face ID</span>
      </div>
      <div class="s-notif-text">Посмотрите на экран</div>
    </div>

    <div class="push"></div>
    <div class="s-cta" style="width: 100%; padding-left: 0; padding-right: 0">
      <div
        class="s-btn"
        data-jump="menu"
        aria-label="Открыть черновики по Face ID"
      >
        Разблокировать
      </div>
      <div
        class="s-btn night mt8"
        data-back
        aria-label="Ввести код-пароль вместо Face ID"
      >
        Ввести код-пароль
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
