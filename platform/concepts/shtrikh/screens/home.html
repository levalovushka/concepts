<div class="screen s-page" id="scr-home">
  <div class="body-scroll s-scroll s-feed">
    <header class="s-vkbar">
      <strong>Штрих</strong>
      <div>
        <button class="s-vkicon" aria-label="Поиск">
          <svg class="ico-svg"><use href="#i-search" /></svg></button
        ><button
          class="s-vkicon"
          data-go="problem"
          aria-label="Новая зарисовка"
        >
          <svg class="ico-svg"><use href="#i-plus" /></svg>
        </button>
      </div>
    </header>
    <nav class="s-feed-tabs">
      <button class="is-on">Новости</button><button>Для вас</button>
    </nav>
    <div class="s-stories" aria-label="Свежие серии">
      <button class="s-story" data-go="problem">
        <span class="s-story-ring add"><span class="ph"></span><i>+</i></span
        ><b>Ваш штрих</b></button
      ><button class="s-story">
        <span class="s-story-ring"><span class="ph"></span></span
        ><b>Арбат</b></button
      ><button class="s-story">
        <span class="s-story-ring"><span class="ph"></span></span
        ><b>Старый город</b></button
      ><button class="s-story">
        <span class="s-story-ring seen"><span class="ph"></span></span
        ><b>У воды</b>
      </button>
    </div>
    <article class="s-card s-post">
      <header class="s-post-head">
        <button
          class="s-avatar"
          data-go="profile"
          aria-label="Профиль Алины Рахимовой"
        >
          <span class="ph"></span>
        </button>
        <div>
          <strong>Алина Рахимова</strong
          ><span>12 минут назад · ул. Панфилова</span>
        </div>
        <button class="s-more" aria-label="Меню">
          <svg class="ico-svg"><use href="#i-ellipsis" /></svg>
        </button>
      </header>
      <p>
        Поймала тень от липы до того, как включили фонари. Бумага, линер 0.3
      </p>
      <button class="s-sketch" data-go="post" aria-label="Открыть зарисовку">
        <span class="ph"></span
        ><span class="s-place-tag"
          ><svg class="ico-svg"><use href="#i-map-pin" /></svg>Панфилова,
          84</span
        >
      </button>
      <div class="s-reactions">
        <button aria-label="Поставить реакцию">
          <svg class="ico-svg"><use href="#i-heart" /></svg>146</button
        ><button data-go="post" aria-label="Открыть отклики к зарисовке">
          <svg class="ico-svg"><use href="#i-message-circle" /></svg>18</button
        ><button aria-label="Поделиться зарисовкой">
          <svg class="ico-svg"><use href="#i-share" /></svg>7</button
        ><button class="last" aria-label="Просмотры публикации">
          <svg class="ico-svg"><use href="#i-eye" /></svg>1,2K
        </button>
      </div>
    </article>
    <button
      class="s-card s-series-tease"
      data-go="chronicle"
      aria-label="Открыть серию места «Один двор, четыре погоды»"
    >
      <span class="s-series-mark ph" aria-hidden="true"></span>
      <span class="s-series-copy">
        <span>Серия места</span>
        <h2>Один двор, четыре погоды</h2>
        <p>12 работ · 7 авторов · Медеуский район</p>
      </span>
      <svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
    </button>
    <article class="s-card s-post">
      <header class="s-post-head">
        <span class="s-avatar"><span class="ph"></span></span>
        <div>
          <strong>Миша Ким</strong><span>сегодня в 09:40 · Зелёный базар</span>
        </div>
        <button class="s-more" aria-label="Меню публикации">
          <svg class="ico-svg"><use href="#i-ellipsis" /></svg>
        </button>
      </header>
      <p>Пять минут на продавца гранатов. Добавил работу в общую серию рынка</p>
      <div class="s-sketch"><span class="ph"></span></div>
      <div class="s-reactions">
        <button aria-label="Поставить реакцию">
          <svg class="ico-svg"><use href="#i-heart" /></svg>83</button
        ><button aria-label="Сохранить зарисовку">
          <svg class="ico-svg"><use href="#i-message-circle" /></svg>6</button
        ><button aria-label="Поделиться зарисовкой">
          <svg class="ico-svg"><use href="#i-share" /></svg></button
        ><button class="last" aria-label="Просмотры публикации">
          <svg class="ico-svg"><use href="#i-eye" /></svg>604
        </button>
      </div>
    </article>
  </div>
  <nav class="tabbar s-dock">
    <div class="tab is-on" data-go="home">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-house" /></svg></span
      ><span class="tab-label">Главная</span>
    </div>
    <div class="tab" data-go="yard">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-map-pin" /></svg></span
      ><span class="tab-label">Места</span>
    </div>
    <div class="tab" data-go="events">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-calendar" /></svg></span
      ><span class="tab-label">Пленэры</span>
    </div>
    <div class="tab" data-go="menu">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-menu" /></svg></span
      ><span class="tab-label">Сервисы</span>
    </div>
  </nav>
  <div class="home-ind"></div>
</div>
