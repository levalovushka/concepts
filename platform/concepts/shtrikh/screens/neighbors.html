<div class="screen s-page" id="scr-neighbors">
  <div class="body-scroll s-scroll s-safe">
    <div class="s-top">
      <div class="s-back tap" data-back aria-label="Назад в меню">
        <svg class="ico-svg ios-back"><use href="#i-chevron-left" /></svg>
      </div>
      <div class="s-top-title sm">Авторы</div>
    </div>

    <div class="s-card" data-hide-denied="contacts">
      <div class="s-sec">3 совпадения</div>
      <div
        class="s-row"
        data-go="profile"
        aria-label="Профиль Петра Ильина, кв. 12"
      >
        <div class="s-ava lg" aria-hidden="true"><div class="ph"></div></div>
        <div class="s-row-main">
          <div class="s-row-title">Пётр Ильин</div>
          <div class="s-row-sub">линер · в контактах как «Петя»</div>
        </div>
        <span class="s-caret" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-chevron-right" /></svg
        ></span>
      </div>
      <div
        class="s-row"
        data-go="profile"
        aria-label="Профиль Марины Кольцовой, кв. 48"
      >
        <div class="s-ava lg" aria-hidden="true"><div class="ph"></div></div>
        <div class="s-row-main">
          <div class="s-row-title">Марина Кольцова</div>
          <div class="s-row-sub">акварель · в контактах как «Марина»</div>
        </div>
        <span class="s-caret" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-chevron-right" /></svg
        ></span>
      </div>
      <div
        class="s-row"
        data-go="profile"
        aria-label="Профиль Ирины Тепляк, кв. 51"
      >
        <div class="s-ava lg" aria-hidden="true"><div class="ph"></div></div>
        <div class="s-row-main">
          <div class="s-row-title">Ирина Тепляк</div>
          <div class="s-row-sub">маркеры · в контактах как «Ира»</div>
        </div>
        <span class="s-caret" aria-hidden="true"
          ><svg class="ico-svg"><use href="#i-chevron-right" /></svg
        ></span>
      </div>
    </div>

    <div class="s-note perm-hidden" data-show-denied="contacts">
      <svg class="ico-svg"><use href="#i-circle-alert" /></svg>
      <span>Без контактов — поиск по имени ниже</span>
    </div>

    <section class="s-author-search">
      <h2>Найти другого автора</h2>
      <button class="s-search" data-toast="Введите имя или псевдоним">
        <svg class="ico-svg"><use href="#i-search" /></svg>
        <span class="s-search-ph">Имя или псевдоним</span>
      </button>
      <button class="s-author-option" data-toast="Поиск среди контактов">
        <span class="s-list-icon blue"
          ><svg class="ico-svg"><use href="#i-users" /></svg></span
        ><span><b>Из телефонной книги</b><small>Показать знакомых авторов</small></span
        ><svg class="ico-svg chevron"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
