<div class="screen s-page" id="scr-meters">
  <div class="body-scroll s-scroll">
    <header class="s-pushbar">
      <button data-back>
        <svg class="ico-svg ios-back">
          <use href="#i-chevron-left" />
        </svg></button
      ><strong>Уведомления</strong><span></span>
    </header>
    <div class="s-list-section">
      <h2>В приложении</h2>
      <button data-ask="push|settings|meters">
        <span
          ><b>Ответы и реакции</b
          ><small>Комментарии к вашим работам</small></span
        ><span class="switch" data-switch="commnotif"><i></i></span></button
      ><button data-activate="commnotif|settings">
        <span
          ><b>Сообщения</b
          ><small>Имена авторов и названия пленэров</small></span
        ><span class="switch is-on"><i></i></span></button
      ><button>
        <span
          ><b>Новые работы места</b
          ><small>Только сохранённые точки</small></span
        ><span class="switch is-on"><i></i></span></button
      ><button>
        <span><b>Пленэры</b><small>Перенос и точка сбора</small></span
        ><span class="switch is-on"><i></i></span>
      </button>
    </div>
    <div class="s-list-section">
      <h2>Тихие часы</h2>
      <button>
        <span><b>Не беспокоить ночью</b><small>С 23:00 до 08:00</small></span
        ><span class="switch"><i></i></span>
      </button>
    </div>
    <p class="s-list-foot perm-hidden" data-show-denied="push">
      Ответы останутся внутри приложения
    </p>
    <p class="s-list-foot perm-hidden" data-show-denied="commnotif">
      Новые сообщения останутся во вкладке «Чаты»
    </p>
  </div>
  <div class="home-ind"></div>
</div>
