<div class="screen s-page" id="scr-code">
  <div class="body-scroll s-scroll s-safe s-col">
    <div class="s-top">
      <div class="s-back tap" data-back aria-label="Назад к номеру">
        <svg class="ico-svg"><use href="#i-chevron-left" /></svg>
      </div>
      <div class="s-top-title sm">Код из письма</div>
    </div>

    <div class="s-hero" style="padding-top: 8px">
      <div class="s-hero-t">Проверьте почту</div>
      <div class="s-hero-d">Код отправлен на marina@inbox.ru</div>
    </div>

    <div
      class="otp tap"
      style="margin: 4px 0 0; padding: 0 16px"
      data-go="codefail"
      aria-label="Ввести код"
    >
      <div class="otp-cell is-filled">2</div>
      <div class="otp-cell is-filled">6</div>
      <div class="otp-cell is-active"></div>
      <div class="otp-cell"></div>
    </div>

    <div class="s-note mute center" style="padding-top: 16px">
      <span>Отправить письмо повторно через 0:24</span>
    </div>

    <div class="push"></div>
    <div class="s-cta">
      <div class="s-btn" data-go="join">Продолжить</div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
