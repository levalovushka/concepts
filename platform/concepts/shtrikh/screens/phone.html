<div class="screen s-page auth-shtrikh is-on" id="scr-phone">
  <div class="body-scroll s-authbook">
    <header class="s-auth-top">
      <span class="s-auth-word">Штрих</span
      ><button class="s-auth-help" data-toast="Помощь · shtrikh.app/help">
        Помощь
      </button>
    </header>
    <section class="s-auth-cover" aria-label="Городской скетчбук">
      <span class="s-auth-kicker">городской скетчбук</span>
      <div class="s-auth-line"></div>
      <h1>Город виден<br />по-разному</h1>
      <p>Сохраняйте зарисовки, находите авторов и рисуйте одно место вместе</p>
      <div class="s-auth-stamp">
        <svg class="ico-svg"><use href="#i-file-text" /></svg
        ><span>Алматы<br />сегодня</span>
      </div>
    </section>
    <section class="s-auth-sheet">
      <div class="s-auth-field">
        <span>Номер телефона</span><strong>+7 701 234-56-78</strong>
      </div>
      <button class="s-auth-primary" data-go="password">Продолжить</button>
      <div class="s-auth-or"><span>или</span></div>
      <button class="s-auth-outline" data-go="register">
        Создать аккаунт художника
      </button>
      <button class="s-auth-guest" data-go="home">
        Смотреть город без аккаунта
      </button>
      <button class="s-auth-guest" data-go="join">Выбрать свой город</button>
      <p class="s-auth-legal">
        Продолжая, вы принимаете
        <button data-toast="Условия · shtrikh.app/terms">
          условия сервиса
        </button>
        и
        <button data-toast="Политика · shtrikh.app/privacy">
          политику конфиденциальности</button
        >.
      </p>
      <div class="auth-links">
        <button class="auth-link" data-toast="Помощь · shtrikh.app/help">
          Помощь</button
        ><button class="auth-link" data-toast="Поддержка · support@shtrikh.app">
          Поддержка</button
        ><button class="auth-link" data-toast="Соглашение · shtrikh.app/terms">
          Пользовательское соглашение
        </button>
      </div>
    </section>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
