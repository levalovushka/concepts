<div class="screen sc" id="scr-codefail">
  <main class="sc-auth">
    <button class="sc-hit sc-back" data-back aria-label="Назад"><svg class="sc-icon"><use href="#i-chevron-left"/></svg></button>
    <div class="sc-auth-copy compact"><span class="sc-kicker">ПОДТВЕРЖДЕНИЕ</span><h1>Введите код</h1><p>Отправили его на +7 900 123-45-67</p></div>
    <div class="sc-otp" aria-label="Код из четырёх цифр"><span class="is-error">4</span><span class="is-error">8</span><span class="is-error">2</span><span class="is-error">6</span></div>

  <div class="home-ind"></div>
