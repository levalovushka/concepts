<div class="screen rh-screen" id="scr-analysis">
  <div class="rh-nav">
    <button class="rh-back tap" data-back><svg class="ico-svg ios-back"><use href="#i-chevron-left"/></svg><span>Прогон</span></button>
    <b>Разбор</b>
    <button class="rh-act tap" data-toast="Разбор сохранён">Готово</button>
  </div>

  <div class="rh-scroll has-dock">
    <div class="rh-verdict">
      <div class="rh-verdict-top">
        <b>7:24</b>
        <span class="rh-delta">+0:24</span>
      </div>
      <p class="rh-sub mt4">План 7:00 · три блока в регламенте, один вышел за него</p>

      <div class="rh-tl" aria-label="Блоки: план и факт">
        <div class="rh-tl-row">
          <span>Контекст</span>
          <div class="rh-tl-bar"><i style="width:36%"></i><b style="left:40%"></b></div>
          <em>1:12</em>
        </div>
        <div class="rh-tl-row">
          <span>Проблема</span>
          <div class="rh-tl-bar"><i style="width:53%"></i><b style="left:51%"></b></div>
          <em>1:44</em>
        </div>
        <div class="rh-tl-row">
          <span>Решение</span>
          <div class="rh-tl-bar"><i class="over" style="width:100%"></i><b style="left:81%"></b></div>
          <em class="over">3:18</em>
        </div>
        <div class="rh-tl-row">
          <span>Следующий шаг</span>
          <div class="rh-tl-bar"><i style="width:35%"></i><b style="left:40%"></b></div>
          <em>1:10</em>
        </div>
      </div>
    </div>

    <div class="rh-sec">Что смотреть</div>
    <div class="rh-card">
      <button class="rh-row multi inset-lead tap" data-go="moment">
        <span class="rh-lead hot"><svg class="ico-svg"><use href="#i-triangle-alert"/></svg></span>
        <div class="rh-grow">
          <div class="rh-hd">«Решение» длиннее плана на 38 секунд</div>
          <div class="rh-ft">02:06–05:24 · дольше, чем в трёх прошлых прогонах</div>
        </div>
        <span class="rh-chev"></span>
      </button>
      <button class="rh-row multi inset-lead tap" data-go="moment">
        <span class="rh-lead"><svg class="ico-svg"><use href="#i-pin"/></svg></span>
        <div class="rh-grow">
          <div class="rh-hd">Три метки внутри одного блока</div>
          <div class="rh-ft">00:36 · 01:53 · 02:41 — все в «Решении»</div>
        </div>
        <span class="rh-chev"></span>
      </button>
      <button class="rh-row multi inset-lead tap" data-go="moment">
        <span class="rh-lead"><svg class="ico-svg"><use href="#i-clock"/></svg></span>
        <div class="rh-grow">
          <div class="rh-hd">«Следующий шаг» короче плана на 10 секунд</div>
          <div class="rh-ft">06:14–07:24 · четвёртый прогон подряд</div>
        </div>
        <span class="rh-chev"></span>
      </button>
    </div>

    <div class="rh-sec">Прогон</div>
    <div class="rh-facts">
      <div class="rh-fact"><b>14</b><span>прогон по теме</span></div>
      <div class="rh-fact"><b>3</b><span>метки</span></div>
      <div class="rh-fact"><b>−0:48</b><span>к первому</span></div>
    </div>

    <div class="rh-sec">Рядом</div>
    <div class="rh-card">
      <div class="rh-row inset-mark">
        <div class="rh-mark over"><b>+72</b><span>сек</span></div>
        <div class="rh-grow">
          <div class="rh-hd">Воскресенье, 8:12</div>
          <div class="rh-ft">«Решение» 4:02 · 5 меток</div>
        </div>
      </div>
      <div class="rh-row inset-mark">
        <div class="rh-mark under"><b>−12</b><span>сек</span></div>
        <div class="rh-grow">
          <div class="rh-hd">Четверг, 6:48</div>
          <div class="rh-ft">«Контекст» скомкан · 1 метка</div>
        </div>
      </div>
    </div>
  </div>

  <div class="rh-dock">
    <button class="rh-primary tap" data-go="setup">Повторить прогон</button>
  </div>
  <div class="home-ind"></div>
</div>
