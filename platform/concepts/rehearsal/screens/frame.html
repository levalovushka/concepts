<div class="screen rh-screen rh-camera" id="scr-frame">
  <div class="rh-nav over">
    <button class="rh-back tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></button>
    <b>Проверка кадра</b>
    <span></span>
  </div>

  <div class="rh-stage">
    <div class="ph on-dark rh-guide" aria-label="Предпросмотр камеры">
      <div class="rh-thirds" aria-hidden="true">
        <i class="vl" style="left:33.33%"></i><i class="vl" style="left:66.66%"></i>
        <i class="hz" style="top:33.33%"></i><i class="hz" style="top:66.66%"></i>
      </div>
      <div class="rh-headroom" aria-hidden="true"><span>линия глаз</span></div>
    </div>

    <div class="rh-cam-checks">
      <div class="rh-check">
        <svg class="ico-svg"><use href="#i-check"/></svg>
        <span>Высота камеры</span><b>на уровне глаз</b>
      </div>
      <div class="rh-check">
        <svg class="ico-svg"><use href="#i-check"/></svg>
        <span>Горизонт</span><b>ровно</b>
      </div>
      <div class="rh-check warn">
        <svg class="ico-svg"><use href="#i-triangle-alert"/></svg>
        <span>Свет сзади</span><b>окно за спиной</b>
      </div>
    </div>
  </div>

  <div class="rh-dock on-cam">
    <button class="rh-primary tap" data-go="recording">Кадр готов</button>
  </div>
  <div class="home-ind"></div>
</div>
