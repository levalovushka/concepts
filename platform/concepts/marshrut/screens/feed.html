<div class="screen ios-surface m-page" id="scr-feed">
  <div class="body-scroll m-scroll m-safe">
    <div class="m-top">
      <div class="m-top-title">Дом → офис</div>
      <div class="m-top-acts">
        <button class="m-icon tap" data-go="notif" aria-label="Оповещения">
          <svg class="ico-svg"><use href="#i-bell" /></svg
          ><span class="m-badge">2</span></button
        ><button
          class="m-icon tap"
          data-primary
          data-go="compose"
          aria-label="Добавить факт"
        >
          <svg class="ico-svg"><use href="#i-plus" /></svg
          ><span class="m-sr-only">Добавить факт</span>
        </button>
      </div>
    </div>
    <div class="m-wrap">
      <section class="m-promo">
        <div class="m-promo-lab">КОРИДОР · 7,4 КМ</div>
        <div class="m-promo-t">3 риска на пяти участках</div>
        <div class="m-promo-d">
          Пак обновлён в 07:42. Ближайший риск через 1,2 км.
        </div>
        <button class="m-pill tap" data-go="music">Все коридоры</button>
      </section>
      <div class="m-sec-head">
        <h2>По ходу движения</h2>
        <span>свежее сверху</span>
      </div>
      <section class="m-card">
        <button
          class="m-row tap"
          data-go="post"
          aria-label="Открыть риск Лёд у спуска"
        >
          <span class="m-bul warn"
            ><svg class="ico-svg"><use href="#i-triangle-alert" /></svg></span
          ><span class="m-row-copy"
            ><span class="m-row-t">1,2 км · Лёд у спуска</span
            ><span class="m-row-s"
              >Спуск к реке · подтверждён 8 минут назад</span
            ></span
          ><span class="m-status is-warn">опасно</span>
        </button>
        <button
          class="m-row tap"
          data-go="post"
          aria-label="Открыть риск Песок после поворота"
        >
          <span class="m-bul accent"
            ><svg class="ico-svg"><use href="#i-map-pin" /></svg></span
          ><span class="m-row-copy"
            ><span class="m-row-t">3,6 км · Песок после поворота</span
            ><span class="m-row-s"
              >Набережная · срок истекает через 19 минут</span
            ></span
          ><span class="m-status is-moving">свежий</span>
        </button>
        <button
          class="m-row tap"
          data-go="route"
          aria-label="Перепроверить ремонт у моста"
        >
          <span class="m-bul"
            ><svg class="ico-svg"><use href="#i-wrench" /></svg></span
          ><span class="m-row-copy"
            ><span class="m-row-t">5,9 км · Ремонт у моста</span
            ><span class="m-row-s">Вчера · нужен контрольный проезд</span></span
          ><span class="m-status is-wait">проверить</span>
        </button>
        <div class="m-row">
          <span class="m-bul accent"
            ><svg class="ico-svg"><use href="#i-check" /></svg></span
          ><span class="m-row-copy"
            ><span class="m-row-t">6,8–7,4 км · Путь свободен</span
            ><span class="m-row-s"
              >Мост — офис · проверено сегодня в 07:31</span
            ></span
          ><span class="m-status is-ready">чисто</span>
        </div>
      </section>
      <div class="m-note">
        <svg class="ico-svg"><use href="#i-cloud-off" /></svg
        ><span
          >Без сети показан последний пакет; устаревшие факты отмечаются
          отдельно.</span
        >
      </div>
    </div>
  </div>
  <div class="tabbar m-dock" aria-label="Основная навигация">
    <div
      class="tab is-on tap"
      aria-current="page"
      data-go="feed"
      aria-label="Раздел Путь"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-house" /></svg
      ></span>
    </div>
    <div class="tab tap" data-go="rides" aria-label="Раздел Проверки">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-clipboard-check" /></svg
      ></span>
    </div>
    <div class="tab tap" data-go="music" aria-label="Раздел Маршруты">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-route" /></svg
      ></span>
    </div>
    <div class="tab tap" data-go="profile" aria-label="Раздел Профиль">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg
      ></span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
  <span
    data-lint-marker
    class="ios-disclosure m-dates m-date m-date-ring m-date-in m-date-add m-date-lab m-promo-more m-post-face m-kin m-media-pair m-acts m-act m-online m-count m-way m-way-dot m-composer m-composer-face m-composer-hint m-composer-act m-thumbs m-thumb m-cast-ctl m-call-end m-stopcast m-cast-art m-cast-t m-cast-s m-cast-track m-stage m-cast m-editor m-album-cast"
    aria-hidden="true"
  ></span>
</div>
