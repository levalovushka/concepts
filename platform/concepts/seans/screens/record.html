<div class="screen" id="scr-record" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark" aria-hidden="true"></div>
    <div class="progress-rec" aria-hidden="true"><i style="width:73%"></i></div>
    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть камеру"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Клип с показа</div>
      <div class="cam-trailing">
        <div class="se-rec-pill"><span class="rec-dot" aria-hidden="true"></span><span class="se-num">0:22 / 0:30</span></div>
      </div>
    </div>

    <div class="se-fb perm-hidden se-fb-float" data-show-denied="photoadd">Клип остался в «Моих записях»: доступа к медиатеке нет, в «Фото» он не попадёт.</div>

    <div class="se-cam-hint">Тише: в зале идёт кино, звук у всех в наушниках</div>

    <div class="cam-bottom">
      <div class="cam-controls">
        <div class="cam-slot"><div class="cam-thumb ph on-dark" aria-label="Предыдущий клип"></div></div>
        <button class="cam-shutter is-video is-rec tap" data-toast="Клип 0:22 записан|record" aria-label="Остановить запись"></button>
        <div class="cam-slot"><div class="icon-btn on-dark tap" data-toast="Камера переключена на фронтальную|record" aria-label="Сменить камеру"><svg class="ico-svg"><use href="#i-rotate-cw"/></svg></div></div>
      </div>
      <div class="cam-actions">
        <div class="btn-filled block tap" data-ask="photoadd|record|record">
          <svg class="ico-svg"><use href="#i-download"/></svg>
          Сохранить в «Фото»
        </div>
        <div class="btn-plain on-dark tap" data-toast="Клип отправлен площадке, появится после показа|clips">Отдать площадке</div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
