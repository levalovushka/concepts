<div class="screen" id="scr-scan" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark" aria-hidden="true"></div>
    <div class="se-frame" aria-hidden="true"></div>
    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть сканер"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Код точки показа</div>
    </div>
    <div class="se-scanhint">
      <div class="se-scanhint-t">Код напечатан у входа и светится на экране</div>
      <div class="se-scanhint-b">Наведите камеру — телефон встанет в зал сам, интернет не нужен</div>
    </div>
    <div class="cam-bottom">
      <div class="se-found" data-go="join" aria-label="Найден код: крыша на Автозаводской">
        <div class="se-found-ico" aria-hidden="true"><svg class="ico-svg"><use href="#i-scan-line"/></svg></div>
        <div class="grow">
          <div class="se-t1">Крыша на Автозаводской</div>
          <div class="se-t2">код <span class="se-num">41-90-27</span> · зал на 18 мест</div>
        </div>
        <span class="se-chev" aria-hidden="true"><svg class="ico-svg"><use href="#i-chevron-right"/></svg></span>
      </div>
      <div class="cam-actions">
        <div class="btn-plain on-dark tap" data-toast="Код 41-90-27 принят|join">Ввести код цифрами</div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
