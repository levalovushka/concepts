<div class="screen vl-screen vl-player" id="scr-player">
  <header class="vl-player-head"><button class="tap" data-back aria-label="Свернуть плеер"><svg><use href="#i-chevron-down"/></svg></button><div><small>ИГРАЕТ ВОЛНА</small><strong>В дорогу</strong></div><button class="tap" data-toast="Меню трека" aria-label="Меню трека"><svg><use href="#i-ellipsis"/></svg></button></header>
  <div class="vl-player-body">
    <img class="vl-player-art" src="assets/media/artist-lina.png" alt="Обложка трека Soft Current">
    <section class="vl-now"><div><h1>Soft Current</h1><button data-go="artist">Лина Моро</button></div><button class="vl-save-track" data-primary data-toast="Трек сохранён" aria-label="Сохранить трек"><svg><use href="#i-heart"/></svg><span>Сохранить трек</span></button></section>
    <div class="vl-timeline"><i><b></b></i><div><span>1:18</span><span>−2:23</span></div></div>
    <div class="vl-transport"><button class="tap" data-toast="Предыдущий трек" aria-label="Предыдущий трек"><svg><use href="#i-skip-back"/></svg></button><button class="vl-pause tap" data-toast="Пауза" aria-label="Пауза"><svg><use href="#i-pause"/></svg></button><button class="tap" data-toast="Следующий трек" aria-label="Следующий трек"><svg><use href="#i-skip-forward"/></svg></button></div>
    <div class="vl-player-tools"><button class="tap" data-toast="Поток перестроен" aria-label="Перемешать"><svg><use href="#i-shuffle"/></svg></button><button data-go="queue"><svg><use href="#i-menu"/></svg><span>Очередь · 4 ближайших</span></button><button class="tap" data-toast="Открыт Share Sheet" aria-label="Поделиться"><svg><use href="#i-share"/></svg></button></div>
    <button class="vl-background" data-activate="audio|background"><svg><use href="#i-lock"/></svg><span><strong>Слушать в фоне</strong><small>ALAC из Files · без сети</small></span><svg><use href="#i-chevron-right"/></svg></button>
    <div class="perm-hidden vl-player-denied" data-show-denied="audio">Фоновый режим неактивен — поток играет, пока приложение открыто.</div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
