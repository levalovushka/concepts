<div class="screen" id="scr-scanwifi" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark" aria-label="Кадр камеры: лист с QR-кодом у доски"></div>

    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть сканер"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Лист у доски, слева от расписания</div>
      <div class="cam-trailing"></div>
    </div>

    <div class="nk-scan-frame" aria-hidden="true">
      <div class="nk-code" aria-label="QR-код сети класса"></div>
    </div>

    <div class="cam-bottom">
      <div class="nk-scan-read">
        <div class="nk-scan-read-line">AVTO4-CLASS · WPA2</div>
        <div class="nk-scan-read-sub mono">кабинет 2 · пароль от 1 августа</div>
      </div>
      <div class="cam-actions">
        <div class="btn-filled block tap" data-toast="Параметры сети прочитаны|guestnet" aria-label="Прочитать параметры сети">Прочитать параметры</div>
        <div class="btn-plain on-dark tap" data-back aria-label="Ввести пароль руками">Ввести пароль руками</div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
