<div class="screen" id="scr-call" style="background:linear-gradient(178deg,#16233a 0%,#0e1727 60%,#080c14 100%)">
  <div class="nk-call">
    <div class="push"></div>
    <div class="nk-call-face ph on-dark" aria-hidden="true"></div>
    <div class="nk-call-who">Гущин С. В.</div>
    <div class="nk-call-state">инструктор · группа B-14 · идёт вызов</div>

    <div class="push"></div>
    <div class="nk-call-hint">
      <svg class="ico-svg"><use href="#i-shield"/></svg>
      <span>Номера скрыты: вызов идёт по учебной группе, а не по телефону</span>
    </div>

    <div class="nk-call-pad">
      <div class="nk-call-key off">
        <span aria-hidden="true"><svg class="ico-svg"><use href="#i-mic-off"/></svg></span>

      </div>
      <div class="nk-call-key">
        <span aria-hidden="true"><svg class="ico-svg"><use href="#i-volume-2"/></svg></span>
        <span>Динамик</span>
      </div>
      <div class="nk-call-key">
        <span aria-hidden="true"><svg class="ico-svg"><use href="#i-map-pin"/></svg></span>
        <span>Посадка</span>
      </div>
    </div>

    <div class="nk-call-end-row">
      <div class="nk-call-end tap" data-toast="Вызов завершён · 0:38|lesson" aria-label="Завершить вызов">
        <svg class="ico-svg"><use href="#i-phone-off"/></svg>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
