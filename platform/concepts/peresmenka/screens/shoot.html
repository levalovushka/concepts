<div class="screen" id="scr-shoot" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark" aria-label="Кадр камеры: витрина перед сдачей смены"></div>
    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть камеру"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Витрина · 3 из 6</div>
      <div class="cam-trailing">
        <div class="icon-btn on-dark tap" data-back aria-label="Вспышка"><svg class="ico-svg"><use href="#i-zap"/></svg></div>
      </div>
    </div>
    <div class="pm-hint">Снимите витрину целиком: акт сверяют по кадру, а не по памяти</div>
    <div class="cam-bottom">
      <div class="cam-controls">
        <div class="cam-slot"><div class="cam-thumb ph on-dark" aria-label="Последний снимок акта"></div></div>
        <button class="cam-shutter tap" data-toast="Снимок добавлен в акт передачи|handover" aria-label="Снять витрину"></button>
        <div class="cam-slot"><div class="icon-btn on-dark tap" data-back aria-label="Сменить камеру"><svg class="ico-svg"><use href="#i-rotate-cw"/></svg></div></div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
