<div class="screen pc-page cx-page" id="scr-fleet">
  <div class="body-scroll cx-scroll pc-safe">
    <header class="cx-top">
      <div>
        <span>МАРИНА · СЕВЕРНЫЙ ПИРС</span>
        <h1>Флот</h1>
      </div>
    </header>
    <section class="cx-section">
      <header><h2>Готовы к выходу</h2></header>
      <button class="cx-row tap" data-primary data-go="boat">
        <svg class="ico-svg"><use href="#i-navigation" /></svg
        ><span
          ><b>Роса · Bavaria 34</b
          ><small>Готовность 4/5 · следующий в 19:30</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="boat">
        <svg class="ico-svg"><use href="#i-navigation" /></svg
        ><span
          ><b>Лира · Beneteau 31</b
          ><small>Готовность 5/5 · мест нет</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="cx-section">
      <header><h2>Нужна проверка</h2></header>
      <button class="cx-row tap" data-go="boat">
        <svg class="ico-svg"><use href="#i-triangle-alert" /></svg
        ><span
          ><b>Маяк · помпа</b
          ><small>Запись вчера · повторить до 07:10</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
  </div>
  <div class="tabbar pc-tabs" aria-label="Основная навигация">
    <div class="tab tap" data-go="feed" aria-label="Раздел Выходы">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Выходы</span>
    </div>
    <div class="tab tap" data-go="board" aria-label="Раздел Журнал">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-audio-lines" /></svg></span
      ><span class="tab-label">Журнал</span>
    </div>
    <div
      class="tab tap is-on"
      aria-current="page"
      data-go="fleet"
      aria-label="Раздел Флот"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Флот</span>
    </div>
    <div class="tab tap" data-go="profile" aria-label="Раздел Профиль">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
