<div class="screen pc-page cx-page" id="scr-profile">
  <div class="body-scroll cx-scroll pc-safe">
    <header class="cx-top">
      <div>
        <span>МАРИНА · СЕВЕРНЫЙ ПИРС</span>
        <h1>Профиль</h1>
      </div>
    </header>
    <div class="cx-profile">
      <div class="cx-avatar ph"></div>
      <h2>Алексей Морозов</h2>
      <p>Марина «Северная» · шкотовый</p>
      <div><b>27</b><span>выходов</span><b>9</b><span>записей</span></div>
    </div>
    <section class="cx-section">
      <header><h2>Экипаж</h2></header>
      <button class="cx-row tap" data-ask="contacts|profile|profile">
        <svg class="ico-svg"><use href="#i-users" /></svg
        ><span
          ><b>Найти знакомых</b
          ><small>Сопоставление только после действия</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
      <div class="cx-denied perm-hidden" data-show-denied="contacts">
        <b>Можно продолжить</b
        ><span>Найдите участника по имени или клубному номеру.</span>
      </div>
    </section>
    <section class="cx-section">
      <header><h2>Устройство</h2></header>
      <button class="cx-row tap" data-go="sync">
        <svg class="ico-svg"><use href="#i-repeat-2" /></svg
        ><span
          ><b>Фон и офлайн</b
          ><small>Погода, выходы и очистка видео</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="widget">
        <svg class="ico-svg"><use href="#i-layout-grid" /></svg
        ><span
          ><b>Виджет выхода</b
          ><small>Время, лодка и свободные места</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="credentials">
        <svg class="ico-svg"><use href="#i-key" /></svg
        ><span
          ><b>Судовые пароли</b><small>Страховка и кабинет марины</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="network">
        <svg class="ico-svg"><use href="#i-wifi" /></svg
        ><span><b>Wi‑Fi марины</b><small>Гостевая сеть со стойки</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="lock">
        <svg class="ico-svg"><use href="#i-lock" /></svg
        ><span
          ><b>Судовые документы</b
          ><small>Полисы и паспорта под Face ID</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-go="sponsors">
        <svg class="ico-svg"><use href="#i-banknote" /></svg
        ><span><b>Партнёры</b><small>Настройка бесплатной модели</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <button class="cx-row tap" data-primary data-go="account">
      <svg class="ico-svg"><use href="#i-user" /></svg
      ><span><b>Аккаунт</b><small>Телефон, выход и удаление данных</small></span
      ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
    </button>
  </div>
  <div class="tabbar pc-tabs" aria-label="Основная навигация">
    <div class="tab tap" data-go="feed" aria-label="Раздел Выходы">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Выходы</span>
    </div>
    <div class="tab tap" data-go="board" aria-label="Раздел Журнал">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-audio-lines" /></svg></span
      ><span class="tab-label">Журнал</span>
    </div>
    <div class="tab tap" data-go="fleet" aria-label="Раздел Флот">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Флот</span>
    </div>
    <div
      class="tab tap is-on"
      aria-current="page"
      data-go="profile"
      aria-label="Раздел Профиль"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
