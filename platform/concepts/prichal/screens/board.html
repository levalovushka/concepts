<div class="screen pc-page cx-page" id="scr-board">
  <div class="body-scroll cx-scroll pc-safe">
    <header class="cx-top">
      <div>
        <span>МАРИНА · СЕВЕРНЫЙ ПИРС</span>
        <h1>Бортовой журнал</h1>
      </div>
    </header>
    <section class="cx-section">
      <header>
        <h2>Сейчас важно</h2>
        <span>проверенные факты</span>
      </header>
      <button class="cx-row tap" data-primary data-go="alerts">
        <svg class="ico-svg"><use href="#i-audio-lines" /></svg
        ><span
          ><b>Выход «Огни гавани» перенесён</b
          ><small>Илья Соколов · новое время 21:15</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg></button
      ><button class="cx-row tap" data-toast="Сводка открыта">
        <svg class="ico-svg"><use href="#i-gauge" /></svg
        ><span
          ><b>Порывы у волнореза</b
          ><small>Марина · 9 уз · 6 минут назад</small></span
        ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
      </button>
    </section>
    <section class="cx-section">
      <header><h2>Последние проверки</h2></header>
      <div class="cx-post">
        <div class="ph"></div>
        <span
          ><b>Аня проверила стаксель</b>
          <p>Карабин закрывается туго, нужна повторная проверка.</p>
          <small>«Роса» · понтон C</small></span
        >
      </div>
    </section>
    <button class="cx-row tap" data-go="alerts">
      <svg class="ico-svg"><use href="#i-bell" /></svg
      ><span
        ><b>Оповещения экипажа</b
        ><small>Переносы и именные обновления</small></span
      ><svg class="ico-svg"><use href="#i-chevron-right" /></svg>
    </button>
  </div>
  <div class="tabbar pc-tabs" aria-label="Основная навигация">
    <div class="tab tap" data-go="feed" aria-label="Раздел Выходы">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Выходы</span>
    </div>
    <div
      class="tab tap is-on"
      aria-current="page"
      data-go="board"
      aria-label="Раздел Журнал"
    >
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-audio-lines" /></svg></span
      ><span class="tab-label">Журнал</span>
    </div>
    <div class="tab tap" data-go="fleet" aria-label="Раздел Флот">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-navigation" /></svg></span
      ><span class="tab-label">Флот</span>
    </div>
    <div class="tab tap" data-go="profile" aria-label="Раздел Профиль">
      <span class="ico"
        ><svg class="ico-svg"><use href="#i-user" /></svg></span
      ><span class="tab-label">Профиль</span>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
