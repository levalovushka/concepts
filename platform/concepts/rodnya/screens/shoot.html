<div class="screen r-page" id="scr-shoot">
  <div class="cam">
    <div class="cam-preview ph on-dark"></div>
    <div class="cam-top">
      <div class="btn-plain on-dark tap" data-back aria-label="Закрыть камеру"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="pill">Фото</div>
      <div class="btn-plain on-dark tap" data-toast="Вспышка · авто" aria-label="Вспышка"><svg class="ico-svg"><use href="#i-zap"/></svg></div>
    </div>
    <div class="cam-bottom">
      <div class="cam-controls">
        <div class="cam-thumb ph on-dark tap" data-go="picker" aria-label="Открыть медиатеку"></div>
        <div class="cam-shutter tap" data-primary data-go="compose" aria-label="Снять"><span>Снять</span></div>
        <div class="btn-plain on-dark tap" data-toast="Камера · фронтальная" aria-label="Переключить камеру"><svg class="ico-svg"><use href="#i-rotate-cw"/></svg></div>
      </div>
      <div class="cam-actions">
        <div class="pill tap" aria-label="Режим фото">Фото</div>
        <div class="pill tap" data-toast="Видео пишется со звуком — нужен микрофон" aria-label="Режим видео">Видео</div>
      </div>
    </div>
    <div class="state" data-show-denied="camera" hidden>
      <div class="state-ico"><svg class="ico-svg"><use href="#i-camera"/></svg></div>
      <div class="t-headline">Камера недоступна</div>
      <div class="t-body">Разрешение можно выдать в настройках телефона. Пока публикация собирается из медиатеки.</div>
      <div class="state-actions"><div class="btn-filled tap" data-toast="Публикация соберётся из медиатеки" aria-label="Выбрать из медиатеки">Выбрать из медиатеки</div></div>
    </div>
  </div>
</div>
