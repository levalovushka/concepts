<div class="screen r-page" id="scr-phone">
  <div class="auth">
    <div class="auth-mark" aria-hidden="true"><svg class="ico-svg"><use href="#i-users"/></svg></div>
    <h1 class="auth-title">Вход в «Родню»</h1>
    <p class="auth-lede">Войдите по почте — так ваше место в роду и подписи под снимками останутся с вами при смене телефона.</p>
    <div class="auth-field is-mail">
      <span class="auth-mail-label">Электронная почта</span>
      <span class="auth-mail-value">marina.k@inbox.ru</span>
    </div>
    <p class="auth-hint">Код придёт письмом. Почта нужна только для входа.</p>
    <div class="auth-actions">
      <button class="btn-filled tap" data-primary data-go="code">Продолжить с почтой</button>
      <button class="auth-apple tap" data-activate="applesignin|code" aria-label="Войти с Apple"><svg class="ico-svg auth-apple-mark"><use href="#i-apple"/></svg>Войти с Apple</button>
      <p class="auth-legal">Продолжая, вы принимаете пользовательское соглашение и политику конфиденциальности.</p>
      <div class="auth-links">
        <button class="auth-link" data-toast="Помощь · rodnya.app/help">Помощь</button>
        <button class="auth-link" data-toast="Поддержка · support@rodnya.app">Поддержка</button>
        <button class="auth-link" data-toast="Соглашение · rodnya.app/terms">Пользовательское соглашение</button>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
