<div class="screen ios-surface" id="scr-season" style="background:#f6f3e8">
  <div class="pt-season-head">
    <div><div class="pt-kicker">Август · степной парк</div><h1>Сейчас рядом</h1></div>
    <div class="icon-btn tap" data-go="releases" aria-label="Сезонные выпуски"><svg class="ico-svg"><use href="#i-bell"/></svg></div>
  </div>
  <div class="body-scroll pt-season-body">
    <div class="pt-seg" aria-label="Разделы"><button class="is-on">Сезон</button><button data-go="library">Справочник</button></div>
    <div class="pt-deck">
      <div class="pt-bird-card pt-card-main tap" data-go="bird">
        <div class="ph" style="position:absolute;inset:0 0 132px" aria-label="Место для изображения зяблика"></div>
        <div class="pt-card-copy"><span>Чаще всего слышно утром</span><h2>Зяблик</h2><p>Короткая звонкая фраза с росчерком в конце</p></div>
      </div>
      <div class="pt-bird-card pt-card-back"><div class="ph" style="position:absolute;inset:0" aria-label="Место для следующего вида"></div></div>
    </div>
    <div class="pt-season-note"><span>6 видов в сезонном выпуске</span><span>Работает без связи</span></div>
  </div>
  <div class="pt-dock"><div class="btn-filled block" data-go="identify"><svg class="ico-svg"><use href="#i-scan-line"/></svg>Определить птицу</div></div>
  <div class="home-ind"></div>
</div>
