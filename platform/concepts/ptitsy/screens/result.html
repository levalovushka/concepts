<div class="screen ios-surface" id="scr-result" style="background:#f6f3e8">
  <div class="navbar">
    <div class="nav-leading"><button class="btn-plain tap" data-back>Снова</button></div>
    <div class="title">Совпадение</div>
    <div class="nav-spacer"></div>
  </div>

  <div class="body-scroll pt-result-body">
    <div class="pt-result-stage ph" aria-label="Место для выбранного снимка">
      <div class="pt-confidence">Уверенность 92%</div>
    </div>

    <div class="pt-result-head">
      <div class="pt-kicker">Похоже, это</div>
      <h1>Зяблик</h1>
      <p class="pt-latin">Fringilla coelebs</p>
    </div>

    <div class="pt-sec pt-match">Что совпало</div>
    <div class="pt-match">
      <div class="pt-clue"><svg class="ico-svg"><use href="#i-check"/></svg><span>Две белые полосы на крыле</span></div>
      <div class="pt-clue"><svg class="ico-svg"><use href="#i-check"/></svg><span>Серо-голубой верх головы</span></div>
      <div class="pt-clue"><svg class="ico-svg"><use href="#i-check"/></svg><span>Розовато-бурая грудь</span></div>
      <div class="pt-clue miss"><svg class="ico-svg"><use href="#i-circle-alert"/></svg><span>Хвост в кадр не попал</span></div>
    </div>

    <div class="pt-sec pt-match">Другие варианты</div>
    <div class="pt-list pt-match">
      <button class="pt-alt tap" data-jump="bird">
        <div class="pt-alt-art ph" aria-label="Место для изображения юрка"></div>
        <div><b>Юрок</b></div>
        <em>6%</em><span class="ios-disclosure"></span>
      </button>
      <button class="pt-alt tap" data-jump="bird">
        <div class="pt-alt-art ph" aria-label="Место для изображения зеленушки"></div>
        <div><b>Зеленушка</b></div>
        <em>2%</em><span class="ios-disclosure"></span>
      </button>
    </div>

    <div class="pt-match mt16">
      <div class="btn-filled block tap" data-jump="bird">Открыть карточку вида</div>
      <button class="btn-quiet tap mt8" data-back>Ни один не подходит</button>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
