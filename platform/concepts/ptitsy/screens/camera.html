<div class="screen" id="scr-camera" style="background:#17251d">
  <div class="pt-camera-art"><div class="ph on-dark" style="position:absolute;inset:0" aria-label="Предпросмотр камеры"></div></div>
  <div class="pt-cam-top">
    <button class="icon-btn on-dark tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></button>
    <strong>Держите птицу в круге</strong>
    <span></span>
  </div>
  <div class="pt-focus"><span></span></div>

  <div class="pt-cam-hint">
    <div><svg class="ico-svg"><use href="#i-check"/></svg>Силуэт<b>вьюрковые</b></div>
    <div><svg class="ico-svg"><use href="#i-check"/></svg>Полосы на крыле<b>видно</b></div>
    <div><svg class="ico-svg"><use href="#i-circle-alert"/></svg>Расстояние<b>подойти ближе</b></div>
  </div>

  <div class="pt-cam-bottom">
    <button class="pt-shutter tap" data-go="result" aria-label="Определить"></button>
    <button class="btn-plain on-dark tap" data-jump="library">Искать по признакам</button>
  </div>
  <div class="home-ind"></div>
</div>
