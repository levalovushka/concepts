<div class="screen pl-page" id="scr-phone">
  <div class="auth">
    <div class="auth-mark">П</div><h1 class="auth-title">Вход в «Полку»</h1>
    <p class="auth-lede">Войдите по номеру — так коллекции, уточнения и список поиска останутся с вами при смене телефона.</p>
    <label class="field-label" for="pl-phone">Номер телефона</label>
    <div class="auth-field"><span class="auth-cc">+7</span><input id="pl-phone" class="field-input auth-num" value="900 000-00-00" inputmode="tel" aria-label="Номер телефона"></div>
    <div class="auth-actions">
      <button class="btn-filled tap" data-primary data-go="code">Получить код</button>
      <button class="auth-apple tap" data-activate="applesignin|code" aria-label="Войти с Apple"><svg class="ico-svg auth-apple-mark"><use href="#i-apple"/></svg>Войти с Apple</button>
      <p class="auth-legal">Продолжая, вы принимаете пользовательское соглашение и политику конфиденциальности.</p>
      <div class="auth-links"><button class="auth-link tap" data-toast="Помощь открыта">Помощь</button><button class="auth-link tap" data-toast="Поддержка открыта">Поддержка</button><button class="auth-link tap" data-toast="Соглашение открыто">Пользовательское соглашение</button></div>
    </div>
  </div><div class="home-ind" aria-hidden="true"></div>
</div>
