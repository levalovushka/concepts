<div class="screen pl-page" id="scr-voice">
  <div class="sheet">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body">
      <div class="pl-top"><div class="pl-top-title">Голосовое</div><div class="pl-top-acts"><div class="pl-icon tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></div></div></div>
      <div class="pl-card pad">
        <div class="pl-rec">
          <span class="rec-dot" aria-hidden="true"></span>
          <span class="pl-rec-t">Идёт запись</span>
          <span class="pl-rec-time">0:14</span>
        </div>
        <div class="pl-wave pl-wave-big"></div>
        <div class="pl-times"><span>0:14</span><span>до 5:00</span></div>
      </div>
      <div class="pl-card">
        <div class="pl-row tap" data-toast="Прослушать запись" aria-label="Прослушать перед отправкой">
          <div class="pl-row-face"><svg class="ico-svg"><use href="#i-play"/></svg></div>
          <div class="pl-row-copy"><div class="pl-row-t">Прослушать</div><div class="pl-row-s">перед отправкой, запись остаётся на устройстве</div></div>
        </div>
        <div class="pl-row tap" data-toast="Сохранено в истории" aria-label="Сохранить как историю предмета">
          <div class="pl-row-face"><svg class="ico-svg"><use href="#i-audio-lines"/></svg></div>
          <div class="pl-row-copy"><div class="pl-row-t">Сохранить как историю</div><div class="pl-row-s">попадёт в «Истории» после отправки</div></div>
        </div>
      </div>
      <div class="state" data-show-denied="mic" hidden>
        <div class="state-ico"><svg class="ico-svg"><use href="#i-mic-off"/></svg></div>
        <div class="t-headline">Микрофон недоступен</div>
        <div class="t-body">Разрешение выдаётся в настройках телефона. Пока остаётся текст и вложение.</div>
        <div class="state-actions"><div class="btn-filled tap" data-toast="Остаётся текст и вложение" aria-label="Вернуться к переписке">Написать текстом</div></div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-filled tap" data-primary data-go="conversation" aria-label="Отправить голосовое">Отправить</button>
    </div>
  </div>
</div>
