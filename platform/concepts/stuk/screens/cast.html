<div class="screen sk-screen" id="scr-cast">
  <div class="sk-backdrop" aria-hidden="true">
    <div class="sk-backdrop-video ph on-dark"></div>
    <div class="sk-backdrop-line first"></div>
    <div class="sk-backdrop-line w70"></div>
    <div class="sk-backdrop-line w45"></div>
  </div>
  <div class="sk-scrim" aria-hidden="true"></div>
  <div class="sheet light" style="margin-top:auto">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body">
      <h2 style="margin:2px 0 4px;font-size:20px;letter-spacing:-.03em">Смотреть на телевизоре</h2>
      <p class="sk-dim" style="margin:0 0 6px;font-size:13px;line-height:18px">Ищем по Bonjour в вашей сети. Звук остаётся в телефоне, если наденете наушники.</p>

      <div class="sk-dev">
        <div class="sk-sym-ico"><svg class="sk-icon"><use href="#i-tv-minimal"/></svg></div>
        <div class="sk-dev-body">
          <div class="sk-dev-name">Телевизор в гараже</div>
          <div class="sk-dev-sub">Chromecast · подключался 9 августа</div>
        </div>
        <svg class="sk-icon sm sk-dim"><use href="#i-chevron-right"/></svg>
      </div>
      <div class="sk-dev">
        <div class="sk-sym-ico"><svg class="sk-icon"><use href="#i-tv-minimal"/></svg></div>
        <div class="sk-dev-body">
          <div class="sk-dev-name">Кухня</div>
          <div class="sk-dev-sub">Smart TV · найден только что</div>
        </div>
        <svg class="sk-icon sm sk-dim"><use href="#i-chevron-right"/></svg>
      </div>
      <div class="sk-dev">
        <div class="sk-sym-ico"><svg class="sk-icon"><use href="#i-wifi"/></svg></div>
        <div class="sk-dev-body">
          <div class="sk-dev-name">Приставка в комнате</div>
          <div class="sk-dev-sub">Не отвечает — была в сети вчера</div>
        </div>
        <span class="sk-tag">офлайн</span>
      </div>
    </div>
    <div class="sheet-footer">
      <div class="btn-tinted tap" data-back aria-label="Закрыть выбор устройства">Отмена</div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
