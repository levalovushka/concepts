<div class="screen" id="scr-camera" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark"></div>

    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть съёмку"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">0:41 · звук пишется</div>
      <div class="cam-trailing">
        <div class="icon-btn on-dark tap" aria-label="Фонарь"><svg class="ico-svg"><use href="#i-zap"/></svg></div>
      </div>
    </div>

    <div class="cam-bottom">
      <div class="pill" style="align-self:flex-start"><svg class="sk-icon sm"><use href="#i-mic"/></svg>Микрофон снизу — не закрывайте рукой</div>
      <div class="cam-controls">
        <div class="cam-slot"><div class="cam-thumb ph on-dark"></div></div>
        <div class="cam-shutter is-video is-rec tap" data-go="publish" aria-label="Остановить запись"></div>
        <div class="cam-slot"><span class="pill lite">0,5×</span></div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
