<div class="screen td" id="scr-chats">
  <div class="td-safe"></div>
  <header class="td-head is-root"><h1>Планы</h1><button class="td-hit" data-go="create" aria-label="Создать план"><svg class="td-icon"><use href="#i-plus"/></svg></button></header>
  <div class="td-filter"><button class="td-chip is-on">Активные</button><button class="td-chip">Приглашения</button><button class="td-chip">Завершённые</button></div>
  <div class="body-scroll td-page tight">
    <button class="td-plan-row" data-go="chat"><div class="td-plan-thumb one"></div><div><strong>Кино сегодня</strong><span>20:10 · Севкабель Порт<br>Миша: «Я уже еду»</span></div><span class="td-unread">2</span></button>
    <button class="td-plan-row" data-go="plan"><div class="td-plan-thumb two"></div><div><strong>Ужин после работы</strong><span>Сегодня, 21:00 · 3 участника<br>место ещё выбирают</span></div><svg class="td-icon"><use href="#i-chevron-right"/></svg></button>
    <button class="td-plan-row"><div class="td-plan-thumb three"></div><div><strong>Завтрак в воскресенье</strong><span>Приглашение от Ани<br>ответить до завтра</span></div><svg class="td-icon"><use href="#i-chevron-right"/></svg></button>
    <div class="td-inline-note"><svg class="td-icon"><use href="#i-lock"/></svg><span>У каждого плана своя временная группа. После встречи она переходит в архив, а не в публичную ленту.</span></div>
  </div>
  <div class="tabbar td-tabs"><div class="tab" data-go="home"><span class="ico"><svg><use href="#i-house"/></svg></span><span class="tab-label">Сегодня</span></div><div class="tab" data-go="nearby"><span class="ico"><svg><use href="#i-users"/></svg></span><span class="tab-label">Вместе</span></div><div class="tab" data-go="create"><span class="ico"><svg><use href="#i-plus"/></svg></span><span class="tab-label">Создать</span></div><div class="tab is-on" data-go="chats"><span class="ico"><svg><use href="#i-message-circle"/></svg></span><span class="tab-label">Планы</span></div><div class="tab" data-go="profile"><span class="ico"><svg><use href="#i-user"/></svg></span><span class="tab-label">Вы</span></div></div><div class="home-ind"></div>
</div>
