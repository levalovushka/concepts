<div class="screen td" id="scr-plan">
  <div class="td-safe"></div>
  <header class="td-head"><button class="td-hit" data-back aria-label="Назад"><svg class="td-icon"><use href="#i-chevron-left"/></svg></button><strong>План</strong><button class="td-hit" aria-label="Ещё"><svg class="td-icon"><use href="#i-ellipsis"/></svg></button></header>
  <div class="body-scroll" style="padding-bottom:40px">
    <div class="td-cover plan"><div class="td-cover-copy"><span>Сегодня · 20:10</span><h1>Кино под<br>открытым небом</h1></div></div>
    <div class="td-plan-summary">
      <div class="td-private"><svg class="td-icon"><use href="#i-lock"/></svg>Только для 4 участников</div>
      <div class="td-avatar-stack" style="margin-top:16px"><div class="td-person td-person--s misha"></div><div class="td-person td-person--s anya"></div><div class="td-person td-person--s lena"></div><div class="td-person td-person--s ilya"></div><span>Все подтвердили</span></div>
      <h2>Выберите место</h2>
      <button class="td-place is-on"><svg class="td-icon"><use href="#i-map-pin"/></svg><div><strong>Севкабель Порт</strong><span>20:10 · всем до 24 минут</span></div><span class="td-votes">3</span></button>
      <button class="td-place"><svg class="td-icon"><use href="#i-map-pin"/></svg><div><strong>Новая Голландия</strong><span>20:30 · всем до 31 минуты</span></div><span class="td-votes">1</span></button>
      <div class="td-fallback perm-hidden" data-show-denied="push">Изменения плана будут отмечены точкой внутри приложения.</div>
      <button class="td-primary block" data-toast="Следим за планом">Подтвердить план</button>
      <button class="td-secondary block" data-ask="calendar|plan|plan"><svg class="td-icon" style="width:17px;height:17px"><use href="#i-calendar-plus"/></svg>Добавить в Календарь</button>
      <div class="td-fallback perm-hidden" data-show-denied="calendar">Время остаётся в карточке плана и в напоминании приложения.</div>
      <div class="td-compact-actions"><button class="td-secondary" data-activate="wifiinfo|plan">Я на месте</button><button class="td-secondary" data-activate="remotenotif|plan">Обновлять состав</button><button class="td-secondary" style="grid-column:1/-1" data-go="netqr"><svg class="td-icon" style="width:17px;height:17px"><use href="#i-qr-code"/></svg>Подключиться к сети места</button><button class="td-secondary" style="grid-column:1/-1" data-go="onway"><svg class="td-icon" style="width:17px;height:17px"><use href="#i-audio-lines"/></svg>Голосовые по дороге · 4</button></div>
    </div>
  </div>
</div>
