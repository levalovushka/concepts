<div class="screen td" id="scr-home">
  <div class="td-safe"></div>
  <header class="td-head is-root"><div class="td-logo">Сегодня<i>.</i></div><button class="td-hit" data-go="groups" aria-label="Близкие друзья"><svg class="td-icon"><use href="#i-users"/></svg></button></header>
  <div class="body-scroll td-page tight">
    <p class="td-kicker">Пятница · 14 августа</p>
    <h1 class="td-title">Чем займёмся<br>сегодня?</h1>
    <div class="td-window"><svg class="td-icon"><use href="#i-clock"/></svg><div><small>Ваше окно</small><strong>19:00–23:00</strong></div><span>Изменить</span></div>
    <div class="td-fallback perm-hidden" data-show-denied="location">Геопозиция выключена. Выберите район вручную — друзья и совпадения останутся доступны.</div>
    <div class="td-intents">
      <button class="td-option is-on" data-ask="location|nearby|home"><svg class="td-icon"><use href="#i-play"/></svg><strong>Кино</strong></button>
      <button class="td-option" data-ask="location|nearby|home"><svg class="td-icon"><use href="#i-map-pin"/></svg><strong>Прогулка</strong></button>
      <button class="td-option" data-ask="location|nearby|home"><svg class="td-icon"><use href="#i-users"/></svg><strong>Поесть</strong></button>
      <button class="td-option" data-ask="location|nearby|home"><svg class="td-icon"><use href="#i-volume-2"/></svg><strong>Концерт</strong></button>
    </div>
    <button class="td-primary block" data-ask="location|nearby|home">Показать совпадения</button>
    <div class="td-current"><div><small>ПЛАН ПОДТВЕРЖДЁН</small><strong>Кино под открытым небом</strong><span>20:10 · вы и ещё 3 друга</span></div><button class="td-hit" data-go="plan" aria-label="Открыть план"><svg class="td-icon"><use href="#i-chevron-right"/></svg></button></div>
  </div>
  <div class="tabbar td-tabs">
    <div class="tab is-on" data-go="home"><span class="ico"><svg><use href="#i-house"/></svg></span><span class="tab-label">Сегодня</span></div>
    <div class="tab" data-go="nearby"><span class="ico"><svg><use href="#i-users"/></svg></span><span class="tab-label">Вместе</span></div>
    <div class="tab" data-go="create"><span class="ico"><svg><use href="#i-plus"/></svg></span><span class="tab-label">Создать</span></div>
    <div class="tab" data-go="chats"><span class="ico"><svg><use href="#i-message-circle"/></svg></span><span class="tab-label">Планы</span></div>
    <div class="tab" data-go="profile"><span class="ico"><svg><use href="#i-user"/></svg></span><span class="tab-label">Вы</span></div>
  </div><div class="home-ind"></div>
</div>
