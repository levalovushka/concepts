<div class="screen td" id="scr-create">
  <div class="td-safe"></div>
  <header class="td-head is-root"><h1>Новый план</h1><span></span></header>
  <div class="body-scroll td-form">
    <div class="td-private"><svg class="td-icon"><use href="#i-lock"/></svg>Без публикации — увидят только приглашённые</div>
    <label class="td-form-label">Что делаем</label><div class="td-form-box"><svg class="td-icon"><use href="#i-play"/></svg><div><strong>Кино под открытым небом</strong><span>можно изменить</span></div><svg class="td-icon"><use href="#i-chevron-right"/></svg></div>
    <label class="td-form-label">Когда</label><div class="td-form-box"><svg class="td-icon"><use href="#i-calendar"/></svg><div><strong>Сегодня, 20:10</strong><span>до 23:30</span></div><svg class="td-icon"><use href="#i-chevron-right"/></svg></div>
    <button class="td-secondary block" style="margin-top:12px" data-ask="speech|sayplan|sayplan"><svg class="td-icon"><use href="#i-mic"/></svg>Сказать план</button>
    <label class="td-form-label">Кого позвать</label><div class="td-invitees"><div class="td-invitee"><div class="td-person misha"></div>Миша</div><div class="td-invitee"><div class="td-person anya"></div>Аня</div><div class="td-invitee"><div class="td-person ilya"></div>Илья</div><div class="td-invitee"><div class="td-person lena"></div>Лена</div></div>
    <label class="td-form-label">Обложка · необязательно</label>
    <div class="td-fallback perm-hidden" data-show-denied="camera">Камера недоступна — выберите готовый снимок.</div><div class="td-fallback perm-hidden" data-show-denied="photos">Фото недоступны — можно снять новый кадр.</div>
    <div class="td-media-actions"><button class="td-secondary" data-ask="camera|camera|create"><svg class="td-icon"><use href="#i-camera"/></svg>Снять</button><button class="td-secondary" data-ask="photos|media|create"><svg class="td-icon"><use href="#i-images"/></svg>Из Фото</button></div>
    <button class="td-primary block" style="margin-top:20px" data-go="plans">Отправить приглашение</button>
  </div>
  <div class="tabbar td-tabs"><div class="tab" data-go="home" aria-label="Раздел Сегодня"><span class="ico"><svg><use href="#i-house"/></svg></span><span class="tab-label">Сегодня</span></div><div class="tab" data-go="nearby" aria-label="Раздел Вместе"><span class="ico"><svg><use href="#i-users"/></svg></span><span class="tab-label">Вместе</span></div><div class="tab is-on" data-go="create" aria-label="Раздел Создать"><span class="ico"><svg><use href="#i-plus"/></svg></span><span class="tab-label">Создать</span></div><div class="tab" data-go="plans" aria-label="Раздел Планы"><span class="ico"><svg><use href="#i-message-circle"/></svg></span><span class="tab-label">Планы</span></div><div class="tab" data-go="profile" aria-label="Раздел Вы"><span class="ico"><svg><use href="#i-user"/></svg></span><span class="tab-label">Вы</span></div></div><div class="home-ind"></div>
</div>
