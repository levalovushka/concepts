<div class="screen ios-surface is-on" id="scr-home" style="background:#fff">
            <div class="navbar is-large">
              <div class="nav-top"></div>
              <div class="title large">Главная</div>
            </div>
            <div class="body-scroll" style="padding:4px var(--margin) 20px">
              <p class="t-subhead">
                Замените этот экран. Контракт: доступ вызывается явным жестом, а при отказе
                на том экране, куда приводит отказ, остаётся видимый fallback.
              </p>

              <!-- Триггер доступа: data-ask="ключ|куда при разрешении|куда при отказе".
                   Цепочка из нескольких алертов подряд — через плюс: "speech+mic|…|…" -->
              <div class="btn-filled block mt24" data-primary data-ask="camera|home|home">Действие, которому нужен доступ</div>

              <!-- Fallback обязан быть на том экране, куда приводит отказ, иначе его
                   никто не увидит. Несколько ключей — через запятую: "camera,mic" -->
              <div class="t-footnote perm-hidden mt16" style="color:var(--accent)" data-show-denied="camera">
                Нет доступа к камере — что остаётся работать вместо неё
              </div>
            </div>
            <div class="tabbar light" aria-label="Основная навигация">
              <div class="tab is-on" aria-current="page" data-go="home" aria-label="Раздел Главная"><span class="ico"><svg class="ico-svg"><use href="#i-layout-grid"/></svg></span><span class="tab-label">Главная</span></div>
            </div>
