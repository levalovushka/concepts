<div class="screen" id="scr-camera" style="background:#000">
  <div class="cam">
    <div class="cam-preview ph on-dark"></div>
    <div class="st-frame" aria-hidden="true"></div>
    <div class="st-cam-read">т. 49–72 · страница 3</div>

    <div class="cam-top">
      <div class="icon-btn on-dark tap" data-back aria-label="Закрыть съёмку"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Страница 3 из 4</div>
      <div class="cam-trailing">
        <div class="icon-btn on-dark tap" aria-label="Вспышка"><svg class="ico-svg"><use href="#i-zap"/></svg></div>
      </div>
    </div>

    <div class="cam-bottom">
      <div class="cam-controls">
        <div class="cam-slot"><div class="cam-thumb ph on-dark"></div></div>
        <div class="cam-shutter tap" aria-label="Снять страницу"></div>
        <div class="cam-slot"><div class="st-cam-n">3</div></div>
      </div>
      <div class="cam-actions">
        <div class="btn-filled tap" data-go="sheet">Сохранить 3 страницы</div>
      </div>
    </div>
  </div>
  <div class="home-ind" aria-hidden="true"></div>
</div>
